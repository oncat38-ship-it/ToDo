<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ToDo & Event & Shopping App</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .hover-scale {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .hover-scale:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseApp = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, doc, setDoc, getDoc, onSnapshot };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ICON_PRESETS = ['💼', '🏠', '🛒', '📚', '🏃', '🏥', '🎉', '🎂', '🎊', '🚗', '⭐', '💡', '🔥', '🐾'];

    function App() {
      const [authMode, setAuthMode] = useState('login'); 
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [customIdInput, setCustomIdInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [activeTab, setActiveTab] = useState('daily'); // 'daily' | 'calendar' | 'settings'

      // 日めくりカレンダー用の選択中日付
      const realTodayObj = new Date();
      const realTodayStr = realTodayObj.toISOString().split('T')[0];
      const [viewingDateStr, setViewingDateStr] = useState(realTodayStr);

      // データ構造
      const [todos, setTodos] = useState([]);       // やることリスト
      const [events, setEvents] = useState([]);     // その日のイベント
      const [shoppings, setShoppings] = useState([]); // 買い物リスト

      // モーダル管理
      const [modalType, setModalType] = useState(null); // 'todo' | 'event' | 'shopping' | null
      const [editingItem, setEditingItem] = useState(null);

      // フォーム入力値
      // 1. やことリスト用
      const [todoTitle, setTodoTitle] = useState('');
      const [todoIcon, setTodoIcon] = useState('💼');
      const [todoDate, setTodoDate] = useState(realTodayStr);
      const [todoHasTime, setTodoHasTime] = useState(false);
      const [todoTime, setTodoTime] = useState('09:00');
      const [todoDetail, setTodoDetail] = useState('');

      // 2. その日のイベント用
      const [eventTypePreset, setEventTypePreset] = useState('休日');
      const [eventCustomTitle, setEventCustomTitle] = useState('');
      const [eventWho, setEventWho] = useState('');
      const [eventIcon, setEventIcon] = useState('🎉');
      const [eventDate, setEventDate] = useState(realTodayStr);

      // 3. 買い物リスト用
      const [shopName, setShopName] = useState('');
      const [shopHasDate, setShopHasDate] = useState(true);
      const [shopDate, setShopDate] = useState(realTodayStr);
      const [shopDetail, setShopDetail] = useState('');

      const [isCalendarOpen, setIsCalendarOpen] = useState(false);
      const [currentDate, setCurrentDate] = useState(new Date());

      useEffect(() => {
        const checkFirebaseReady = setInterval(() => {
          if (window.firebaseApp) {
            clearInterval(checkFirebaseReady);
            const { auth, onAuthStateChanged, db, doc, onSnapshot } = window.firebaseApp;

            onAuthStateChanged(auth, (user) => {
              if (user) {
                setCurrentUser(user);
                setIsLoggedIn(true);

                const docRef = doc(db, "users", user.uid);
                onSnapshot(docRef, (docSnap) => {
                  if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.todos) setTodos(data.todos);
                    if (data.events) setEvents(data.events);
                    if (data.shoppings) setShoppings(data.shoppings);
                  } else {
                    const defaultData = { todos: [], events: [], shoppings: [] };
                    setDoc(docRef, defaultData);
                  }
                });
              } else {
                setCurrentUser(null);
                setIsLoggedIn(false);
              }
            });
          }
        }, 100);
      }, []);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const saveUserDataToFirebase = async (overrides = {}) => {
        if (!currentUser) return;
        const { db, doc, setDoc } = window.firebaseApp;
        const docRef = doc(db, "users", currentUser.uid);
        await setDoc(docRef, { todos, events, shoppings, ...overrides }, { merge: true });
      };

      const formatEmailFromId = (id) => `${id.trim().toLowerCase()}@app.local`;

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanId = customIdInput.trim();
        const cleanPass = passwordInput.trim();

        if (!cleanId || !cleanPass) {
          setAuthError('IDとパスワードを入力してください');
          return;
        }

        if (cleanPass.length < 6) {
          setAuthError('パスワードは6文字以上で入力してください');
          return;
        }

        const internalEmail = formatEmailFromId(cleanId);
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseApp;

        try {
          if (authMode === 'signup') {
            await createUserWithEmailAndPassword(auth, internalEmail, cleanPass);
          } else {
            await signInWithEmailAndPassword(auth, internalEmail, cleanPass);
          }
        } catch (err) {
          setAuthError('IDまたはパスワードが正しくありません、または既に使用されています。');
        }
      };

      // 日めくり移動
      const handlePrevDay = () => {
        const d = new Date(viewingDateStr);
        d.setDate(d.getDate() - 1);
        setViewingDateStr(d.toISOString().split('T')[0]);
      };

      const handleNextDay = () => {
        const d = new Date(viewingDateStr);
        d.setDate(d.getDate() + 1);
        setViewingDateStr(d.toISOString().split('T')[0]);
      };

      // --- 保存・削除ロジック ---
      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!todoTitle.trim()) return;

        let nextTodos;
        const payload = {
          title: todoTitle.trim(),
          icon: todoIcon || '💼',
          date: todoDate,
          hasTime: todoHasTime,
          time: todoHasTime ? todoTime : '',
          detail: todoDetail.trim(),
          completed: false
        };

        if (editingItem) {
          nextTodos = todos.map(t => t.id === editingItem.id ? { ...t, ...payload } : t);
        } else {
          nextTodos = [...todos, { id: Date.now().toString(), ...payload }];
        }
        setTodos(nextTodos);
        saveUserDataToFirebase({ todos: nextTodos });
        closeModal();
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        const titleFinal = eventTypePreset === 'その他(自由記入)' ? eventCustomTitle.trim() : eventTypePreset;
        if (!titleFinal) return;

        let nextEvents;
        const payload = {
          title: titleFinal,
          who: eventWho.trim(),
          icon: eventIcon || '🎉',
          date: eventDate
        };

        if (editingItem) {
          nextEvents = events.map(ev => ev.id === editingItem.id ? { ...ev, ...payload } : ev);
        } else {
          nextEvents = [...events, { id: Date.now().toString(), ...payload }];
        }
        setEvents(nextEvents);
        saveUserDataToFirebase({ events: nextEvents });
        closeModal();
      };

      const handleSaveShopping = (e) => {
        e.preventDefault();
        if (!shopName.trim()) return;

        let nextShoppings;
        const payload = {
          name: shopName.trim(),
          date: shopHasDate ? shopDate : '',
          detail: shopDetail.trim(),
          completed: false
        };

        if (editingItem) {
          nextShoppings = shoppings.map(s => s.id === editingItem.id ? { ...s, ...payload } : s);
        } else {
          nextShoppings = [...shoppings, { id: Date.now().toString(), ...payload }];
        }
        setShoppings(nextShoppings);
        saveUserDataToFirebase({ shoppings: nextShoppings });
        closeModal();
      };

      const toggleTodoComplete = (id) => {
        const next = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        setTodos(next);
        saveUserDataToFirebase({ todos: next });
      };

      const toggleShoppingComplete = (id) => {
        const next = shoppings.map(s => s.id === id ? { ...s, completed: !s.completed } : s);
        setShoppings(next);
        saveUserDataToFirebase({ shoppings: next });
      };

      const deleteTodo = (id) => {
        const next = todos.filter(t => t.id !== id);
        setTodos(next);
        saveUserDataToFirebase({ todos: next });
      };

      const deleteEvent = (id) => {
        const next = events.filter(e => e.id !== id);
        setEvents(next);
        saveUserDataToFirebase({ events: next });
      };

      const deleteShopping = (id) => {
        const next = shoppings.filter(s => s.id !== id);
        setShoppings(next);
        saveUserDataToFirebase({ shoppings: next });
      };

      const openModal = (type, item = null) => {
        setModalType(type);
        setEditingItem(item);
        if (type === 'todo') {
          setTodoTitle(item ? item.title : '');
          setTodoIcon(item ? item.icon : '💼');
          setTodoDate(item ? item.date : viewingDateStr);
          setTodoHasTime(item ? item.hasTime : false);
          setTodoTime(item ? item.time : '09:00');
          setTodoDetail(item ? item.detail : '');
        } else if (type === 'event') {
          const presets = ['休日', '誕生日', '冠婚葬祭'];
          if (item) {
            if (presets.includes(item.title)) {
              setEventTypePreset(item.title);
              setEventCustomTitle('');
            } else {
              setEventTypePreset('その他(自由記入)');
              setEventCustomTitle(item.title);
            }
            setEventWho(item.who);
            setEventIcon(item.icon);
            setEventDate(item.date);
          } else {
            setEventTypePreset('休日');
            setEventCustomTitle('');
            setEventWho('');
            setEventIcon('🎉');
            setEventDate(viewingDateStr);
          }
        } else if (type === 'shopping') {
          setShopName(item ? item.name : '');
          setShopHasDate(item ? !!item.date : true);
          setShopDate(item && item.date ? item.date : viewingDateStr);
          setShopDetail(item ? item.detail : '');
        }
      };

      const closeModal = () => {
        setModalType(null);
        setEditingItem(null);
      };

      // 表示日付に合致するデータ抽出
      const viewingTodos = todos.filter(t => t.date === viewingDateStr);
      const viewingEvents = events.filter(e => e.date === viewingDateStr);
      // 買い物リストは日付指定があるものはその日、未定は常に表示 or 選択日に表示
      const viewingShoppings = shoppings.filter(s => !s.date || s.date === viewingDateStr);

      const viewingDateObj = new Date(viewingDateStr);
      const dayOfWeekStr = ['日', '月', '火', '水', '木', '金', '土'][viewingDateObj.getDay()];
      const formattedViewingDate = `${viewingDateObj.getMonth() + 1}月${viewingDateObj.getDate()}日 (${dayOfWeekStr})`;

      // カレンダー生成
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
      
      const calendarDays = [];
      for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(null);
      for (let i = 1; i <= lastDateOfMonth; i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        calendarDays.push({ day: i, dateStr });
      }
      while (calendarDays.length < 42) calendarDays.push(null);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm text-slate-100">
              <div className="text-center mb-6">
                <div className="bg-blue-600 text-white p-3 rounded-2xl w-12 h-12 flex items-center justify-center mx-auto mb-3 shadow-lg">
                  <i data-lucide="check-square" className="w-6 h-6"></i>
                </div>
                <h1 className="text-xl font-extrabold tracking-tight">Life Organizer</h1>
                <p className="text-xs text-slate-400 mt-1">{authMode === 'login' ? 'ログイン' : '新規アカウント登録'}</p>
              </div>

              {authError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs">{authError}</div>}

              <form onSubmit={handleAuthSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-[10px] text-slate-400 mb-1 font-bold">ユーザーID</label>
                  <input type="text" value={customIdInput} onChange={(e) => setCustomIdInput(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm outline-none focus:border-blue-500 text-slate-100 font-bold" placeholder="例: user123" required />
                </div>
                <div>
                  <label className="block text-[10px] text-slate-400 mb-1 font-bold">パスワード (6文字以上)</label>
                  <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm outline-none focus:border-blue-500 text-slate-100" placeholder="••••••••" required />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg transition">{authMode === 'login' ? 'ログイン' : '登録して開始'}</button>
              </form>
              <div className="mt-6 text-center border-t border-slate-800 pt-4">
                <button type="button" onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }} className="text-blue-400 hover:underline text-xs font-semibold">{authMode === 'login' ? 'アカウント作成はこちら' : 'ログイン画面へ戻る'}</button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen text-xs flex flex-col pb-20">
          <header className="border-b bg-white px-4 py-2.5 flex items-center justify-between sticky top-0 z-20 shadow-xs">
            <div className="flex items-center gap-2">
              <span className="text-sm">🗓️</span>
              <span className="font-black text-sm text-slate-900">Life Organizer</span>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => window.firebaseApp.signOut(window.firebaseApp.auth)} className="opacity-60 hover:opacity-100 p-1"><i data-lucide="log-out" className="w-4 h-4"></i></button>
            </div>
          </header>

          <main className="flex-1 max-w-xl w-full mx-auto p-3 space-y-4">
            
            {/* 日めくりカレンダーバー */}
            <div className="bg-slate-900 text-white rounded-2xl p-3 flex items-center justify-between shadow-md">
              <button onClick={handlePrevDay} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold transition">◀ 前日</button>
              <div className="flex items-center gap-2">
                <span className="text-xs font-extrabold">{formattedViewingDate}</span>
                {viewingDateStr !== realTodayStr && (
                  <button onClick={() => setViewingDateStr(realTodayStr)} className="bg-blue-600 hover:bg-blue-500 text-white px-2 py-0.5 rounded-lg text-[10px] font-bold shadow-xs">
                    本日へ
                  </button>
                )}
              </div>
              <button onClick={handleNextDay} className="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold transition">翌日 ▶</button>
            </div>

            {/* カレンダー表示トグル */}
            <div className="flex justify-end">
              <button onClick={() => setIsCalendarOpen(!isCalendarOpen)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
                <span>📅 カレンダーから選ぶ</span>
              </button>
            </div>

            {isCalendarOpen && (
              <div className="bg-white border rounded-2xl p-3 shadow-lg space-y-3 animate-modal">
                <div className="flex items-center justify-between font-bold text-xs">
                  <span>{year}年 {month + 1}月</span>
                  <div className="flex gap-1">
                    <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="px-2 py-1 bg-slate-100 rounded">前月</button>
                    <button onClick={() => setCurrentDate(new Date())} className="px-2 py-1 bg-slate-100 rounded">今月</button>
                    <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="px-2 py-1 bg-slate-100 rounded">次月</button>
                  </div>
                </div>
                <div className="grid grid-cols-7 text-center font-bold opacity-60 text-[10px]">
                  <span className="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {calendarDays.map((item, index) => {
                    if (!item) return <div key={`e-${index}`}></div>;
                    const isSelected = item.dateStr === viewingDateStr;
                    const isToday = item.dateStr === realTodayStr;
                    return (
                      <button key={item.dateStr} onClick={() => { setViewingDateStr(item.dateStr); setIsCalendarOpen(false); }} className={`h-8 rounded-xl text-xs font-bold flex items-center justify-center ${isSelected ? 'bg-blue-600 text-white' : isToday ? 'border-2 border-blue-600 text-blue-600' : 'bg-slate-50 hover:bg-slate-100'}`}>
                        {item.day}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 1. その日のイベント */}
            <div className="bg-white border border-slate-200/80 rounded-2xl p-3.5 space-y-3 shadow-xs">
              <div className="flex items-center justify-between border-b pb-2">
                <span className="font-extrabold text-slate-900 text-xs flex items-center gap-1.5">🎉 その日のイベント</span>
                <button onClick={() => openModal('event')} className="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded-xl text-[11px] font-bold shadow-xs">＋ 追加</button>
              </div>
              <div className="space-y-2">
                {viewingEvents.length === 0 ? (
                  <div className="text-center opacity-40 py-2 text-xs">イベントはありません</div>
                ) : (
                  viewingEvents.map(ev => (
                    <div key={ev.id} className="bg-purple-500/10 border border-purple-200 rounded-xl p-2.5 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-base">{ev.icon}</span>
                        <div>
                          <div className="font-bold text-slate-900 text-xs">{ev.title}</div>
                          {ev.who && <div className="text-[10px] opacity-70">対象: {ev.who}</div>}
                        </div>
                      </div>
                      <div className="flex items-center gap-1">
                        <button onClick={() => openModal('event', ev)} className="p-1 opacity-50 hover:opacity-100"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                        <button onClick={() => deleteEvent(ev.id)} className="p-1 text-rose-500"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* 2. やることリスト */}
            <div className="bg-white border border-slate-200/80 rounded-2xl p-3.5 space-y-3 shadow-xs">
              <div className="flex items-center justify-between border-b pb-2">
                <span className="font-extrabold text-slate-900 text-xs flex items-center gap-1.5">📝 やることリスト</span>
                <button onClick={() => openModal('todo')} className="bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1 rounded-xl text-[11px] font-bold shadow-xs">＋ 追加</button>
              </div>
              <div className="space-y-2">
                {viewingTodos.length === 0 ? (
                  <div className="text-center opacity-40 py-2 text-xs">やることリストはありません</div>
                ) : (
                  viewingTodos.map(todo => (
                    <div key={todo.id} className={`border rounded-xl p-2.5 flex items-center justify-between gap-2 ${todo.completed ? 'bg-slate-50 opacity-50' : 'bg-white'}`}>
                      <div className="flex items-center gap-2.5 flex-1 min-w-0">
                        <input type="checkbox" checked={todo.completed} onChange={() => toggleTodoComplete(todo.id)} className="w-4 h-4 text-blue-600 rounded cursor-pointer shrink-0" />
                        <span className="text-base shrink-0">{todo.icon}</span>
                        <div className="flex-1 min-w-0">
                          <div className={`font-bold text-xs truncate ${todo.completed ? 'line-through' : 'text-slate-900'}`}>{todo.title}</div>
                          <div className="flex items-center gap-2 text-[10px] opacity-60">
                            {todo.hasTime && <span>⏰ {todo.time}</span>}
                            {todo.detail && <span className="truncate">備考: {todo.detail}</span>}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => openModal('todo', todo)} className="p-1 opacity-50 hover:opacity-100"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                        <button onClick={() => deleteTodo(todo.id)} className="p-1 text-rose-500"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* 3. 買い物リスト */}
            <div className="bg-white border border-slate-200/80 rounded-2xl p-3.5 space-y-3 shadow-xs">
              <div className="flex items-center justify-between border-b pb-2">
                <span className="font-extrabold text-slate-900 text-xs flex items-center gap-1.5">🛒 買い物リスト</span>
                <button onClick={() => openModal('shopping')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-xl text-[11px] font-bold shadow-xs">＋ 追加</button>
              </div>
              <div className="space-y-2">
                {viewingShoppings.length === 0 ? (
                  <div className="text-center opacity-40 py-2 text-xs">買い物リストはありません</div>
                ) : (
                  viewingShoppings.map(shop => (
                    <div key={shop.id} className={`border rounded-xl p-2.5 flex items-center justify-between gap-2 ${shop.completed ? 'bg-slate-50 opacity-50' : 'bg-white'}`}>
                      <div className="flex items-center gap-2.5 flex-1 min-w-0">
                        <input type="checkbox" checked={shop.completed} onChange={() => toggleShoppingComplete(shop.id)} className="w-4 h-4 text-emerald-600 rounded cursor-pointer shrink-0" />
                        <div className="flex-1 min-w-0">
                          <div className={`font-bold text-xs truncate ${shop.completed ? 'line-through' : 'text-slate-900'}`}>{shop.name}</div>
                          <div className="flex items-center gap-2 text-[10px] opacity-60">
                            {shop.date ? <span>📅 {shop.date}</span> : <span className="text-emerald-700 font-bold">日付未定</span>}
                            {shop.detail && <span className="truncate">備考: {shop.detail}</span>}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => openModal('shopping', shop)} className="p-1 opacity-50 hover:opacity-100"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                        <button onClick={() => deleteShopping(shop.id)} className="p-1 text-rose-500"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

          </main>

          {/* --- 各種モーダル --- */}

          {/* やことリスト作成/編集モーダル */}
          {modalType === 'todo' && (
            <div className="fixed inset-0 bg-slate-950/70 flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border space-y-3.5 animate-modal">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-xs">📝 やることの{editingItem ? '編集' : '追加'}</h3>
                  <button onClick={closeModal}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <form onSubmit={handleSaveTodo} className="space-y-3">
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">タイトル</label>
                    <input type="text" value={todoTitle} onChange={e => setTodoTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" placeholder="例: 書類提出" required />
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">アイコン (選ぶ or 入力)</label>
                    <div className="flex gap-1.5 mb-1.5 flex-wrap">
                      {ICON_PRESETS.map(ic => (
                        <button key={ic} type="button" onClick={() => setTodoIcon(ic)} className={`w-8 h-8 rounded-xl text-sm flex items-center justify-center border ${todoIcon === ic ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50'}`}>{ic}</button>
                      ))}
                    </div>
                    <input type="text" value={todoIcon} onChange={e => setTodoIcon(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs" placeholder="直接入力も可" maxLength={2} />
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">日付</label>
                    <input type="date" value={todoDate} onChange={e => setTodoDate(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" required />
                  </div>
                  <div className="bg-slate-50 p-2.5 rounded-xl border flex items-center justify-between">
                    <label className="text-xs font-bold flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={todoHasTime} onChange={e => setTodoHasTime(e.target.checked)} className="w-4 h-4 text-blue-600 rounded" />
                      <span>時間指定する</span>
                    </label>
                    {todoHasTime && (
                      <input type="time" value={todoTime} onChange={e => setTodoTime(e.target.value)} className="px-2 py-1 border rounded-lg text-xs font-bold bg-white" />
                    )}
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">備考欄</label>
                    <textarea value={todoDetail} onChange={e => setTodoDetail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs h-16" placeholder="詳細メモなど..." />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={closeModal} className="px-3 py-1.5 border rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold">保存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* イベント作成/編集モーダル */}
          {modalType === 'event' && (
            <div className="fixed inset-0 bg-slate-950/70 flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border space-y-3.5 animate-modal">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-xs">🎉 イベントの{editingItem ? '編集' : '追加'}</h3>
                  <button onClick={closeModal}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <form onSubmit={handleSaveEvent} className="space-y-3">
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">タイトル</label>
                    <select value={eventTypePreset} onChange={e => setEventTypePreset(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold mb-1.5 bg-white">
                      <option value="休日">休日</option>
                      <option value="誕生日">誕生日</option>
                      <option value="冠婚葬祭">冠婚葬祭</option>
                      <option value="その他(自由記入)">その他(自由記入)</option>
                    </select>
                    {eventTypePreset === 'その他(自由記入)' && (
                      <input type="text" value={eventCustomTitle} onChange={e => setEventCustomTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" placeholder="タイトルを入力" required />
                    )}
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">誰の？ (未記入も可能)</label>
                    <input type="text" value={eventWho} onChange={e => setEventWho(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" placeholder="例: 父親, 自分" />
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">アイコン (選ぶ or 入力)</label>
                    <div className="flex gap-1.5 mb-1.5 flex-wrap">
                      {['🎉', '🎂', '🎊', '🎁', '🥂', '✈️', '🚗', '⭐', '🎈'].map(ic => (
                        <button key={ic} type="button" onClick={() => setEventIcon(ic)} className={`w-8 h-8 rounded-xl text-sm flex items-center justify-center border ${eventIcon === ic ? 'bg-purple-600 text-white border-purple-600' : 'bg-slate-50'}`}>{ic}</button>
                      ))}
                    </div>
                    <input type="text" value={eventIcon} onChange={e => setEventIcon(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs" placeholder="直接入力も可" maxLength={2} />
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">日付</label>
                    <input type="date" value={eventDate} onChange={e => setEventDate(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" required />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={closeModal} className="px-3 py-1.5 border rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className="bg-purple-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold">保存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 買い物リスト作成/編集モーダル */}
          {modalType === 'shopping' && (
            <div className="fixed inset-0 bg-slate-950/70 flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border space-y-3.5 animate-modal">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-xs">🛒 買い物の{editingItem ? '編集' : '追加'}</h3>
                  <button onClick={closeModal}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <form onSubmit={handleSaveShopping} className="space-y-3">
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">名前</label>
                    <input type="text" value={shopName} onChange={e => setShopName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" placeholder="例: 牛乳, 洗剤" required />
                  </div>
                  <div className="bg-slate-50 p-2.5 rounded-xl border space-y-2">
                    <label className="text-xs font-bold flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={shopHasDate} onChange={e => setShopHasDate(e.target.checked)} className="w-4 h-4 text-emerald-600 rounded" />
                      <span>日付を指定する (未定ならチェック解除)</span>
                    </label>
                    {shopHasDate && (
                      <input type="date" value={shopDate} onChange={e => setShopDate(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs font-bold bg-white" required />
                    )}
                  </div>
                  <div>
                    <label className="block text-[10px] opacity-60 font-bold mb-1">備考欄</label>
                    <textarea value={shopDetail} onChange={e => setShopDetail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs h-16" placeholder="分量や買うお店など..." />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={closeModal} className="px-3 py-1.5 border rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className="bg-emerald-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold">保存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
