<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo & カレンダー App</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 気象庁エリアコード一覧
    const PREFECTURES = [
      { name: '北海道 (札幌)', code: '016000' },
      { name: '青森県', code: '020000' },
      { name: '岩手県', code: '030000' },
      { name: '宮城県 (仙台)', code: '040000' },
      { name: '秋田県', code: '050000' },
      { name: '山形県', code: '060000' },
      { name: '福島県', code: '070000' },
      { name: '茨城県', code: '080000' },
      { name: '栃木県', code: '090000' },
      { name: '群馬県', code: '100000' },
      { name: '埼玉県', code: '110000' },
      { name: '千葉県', code: '120000' },
      { name: '東京都', code: '130000' },
      { name: '神奈川県', code: '140000' },
      { name: '新潟県', code: '150000' },
      { name: '富山県', code: '160000' },
      { name: '石川県', code: '170000' },
      { name: '福井県', code: '180000' },
      { name: '山梨県', code: '190000' },
      { name: '長野県', code: '200000' },
      { name: '岐阜県', code: '210000' },
      { name: '静岡県', code: '220000' },
      { name: '愛知県 (名古屋)', code: '230000' },
      { name: '三重県', code: '240000' },
      { name: '滋賀県', code: '250000' },
      { name: '京都府', code: '260000' },
      { name: '大阪府', code: '270000' },
      { name: '兵庫県', code: '280000' },
      { name: '奈良県', code: '290000' },
      { name: '和歌山県', code: '300000' },
      { name: '鳥取県', code: '310000' },
      { name: '島根県', code: '320000' },
      { name: '岡山県', code: '330000' },
      { name: '広島県', code: '340000' },
      { name: '山口県', code: '350000' },
      { name: '徳島県', code: '360000' },
      { name: '香川県', code: '370000' },
      { name: '愛媛県', code: '380000' },
      { name: '高知県', code: '390000' },
      { name: '福岡県', code: '400000' },
      { name: '佐賀県', code: '410000' },
      { name: '長崎県', code: '420000' },
      { name: '熊本県', code: '430000' },
      { name: '大分県', code: '440000' },
      { name: '宮崎県', code: '450000' },
      { name: '鹿児島県', code: '460100' },
      { name: '沖縄県 (那覇)', code: '471000' }
    ];

    function App() {
      // 認証関連
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');

      // メインタブ ('today' | 'todos')
      const [activeTab, setActiveTab] = useState('today');

      // データ管理 (完全空白スタート)
      const [lists, setLists] = useState([]);
      const [selectedListId, setSelectedListId] = useState('');
      const [todos, setTodos] = useState([]);
      const [tags, setTags] = useState([]);

      // 地域設定
      const [locationCode, setLocationCode] = useState('130000'); // デフォルト: 東京都

      // 検索・フィルター
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTagFilter, setSelectedTagFilter] = useState('すべて');

      // モーダル管理
      const [isCalendarOpen, setIsCalendarOpen] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isNewListModalOpen, setIsNewListModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Form State (Todo)
      const [editingTodo, setEditingTodo] = useState(null);
      const [formTitle, setFormTitle] = useState('');
      const [formDetail, setFormDetail] = useState('');
      const [formStartDate, setFormStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [formEndDate, setFormEndDate] = useState(new Date().toISOString().split('T')[0]);
      const [formTime, setFormTime] = useState('09:00');
      const [formPriority, setFormPriority] = useState('中');
      const [formTags, setFormTags] = useState([]);
      const [newTagInput, setNewTagInput] = useState('');
      const [newListName, setNewListName] = useState('');

      // カレンダー用
      const [currentDate, setCurrentDate] = useState(new Date());

      // 天気状態
      const [weather, setWeather] = useState({ text: '読み込み中...', icon: '🌤️' });

      // セッション＆ユーザーデータ復元
      useEffect(() => {
        const sessionUser = localStorage.getItem('app_active_user');
        if (sessionUser) {
          loadUserData(sessionUser);
        }
      }, []);

      // Lucide Icons
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // 天気取得 (気象庁API)
      useEffect(() => {
        if (!isLoggedIn) return;
        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${locationCode}.json`)
          .then(res => res.json())
          .then(data => {
            const todayWeather = data[0].timeSeries[0].areas[0].weathers[0];
            let icon = '☀️';
            if (todayWeather.includes('雨')) icon = '🌧️';
            else if (todayWeather.includes('くもり') || todayWeather.includes('曇')) icon = '☁️';
            else if (todayWeather.includes('雪')) icon = '❄️';

            setWeather({ text: todayWeather.split('　')[0], icon });
          })
          .catch(() => {
            setWeather({ text: '天気情報なし', icon: '🌤️' });
          });
      }, [locationCode, isLoggedIn]);

      // ユーザーデータの読み込み
      const loadUserData = (id) => {
        const rawData = localStorage.getItem(`app_data_${id}`);
        if (rawData) {
          const data = JSON.parse(rawData);
          setLists(data.lists || []);
          setSelectedListId(data.selectedListId || (data.lists && data.lists[0]?.id) || '');
          setTodos(data.todos || []);
          setTags(data.tags || []);
          setLocationCode(data.locationCode || '130000');
        } else {
          // 新規ユーザー: 完全空白
          setLists([]);
          setSelectedListId('');
          setTodos([]);
          setTags([]);
          setLocationCode('130000');
        }
        setUserId(id);
        setIsLoggedIn(true);
        localStorage.setItem('app_active_user', id);
      };

      // ユーザーデータの保存
      const saveUserData = (updatedTodos, updatedLists, updatedTags, updatedLocation, updatedSelectedListId) => {
        if (!userId) return;
        const dataToSave = {
          lists: updatedLists !== undefined ? updatedLists : lists,
          selectedListId: updatedSelectedListId !== undefined ? updatedSelectedListId : selectedListId,
          todos: updatedTodos !== undefined ? updatedTodos : todos,
          tags: updatedTags !== undefined ? updatedTags : tags,
          locationCode: updatedLocation !== undefined ? updatedLocation : locationCode
        };
        localStorage.setItem(`app_data_${userId}`, JSON.stringify(dataToSave));
      };

      // 認証処理 (ログイン / 新規登録)
      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        const storedUsers = JSON.parse(localStorage.getItem('app_users_db') || '{}');

        if (authMode === 'signup') {
          if (storedUsers[userId]) {
            setAuthError('このIDは既に登録されています');
            return;
          }
          storedUsers[userId] = password;
          localStorage.setItem('app_users_db', JSON.stringify(storedUsers));
          loadUserData(userId);
        } else {
          if (!storedUsers[userId] || storedUsers[userId] !== password) {
            setAuthError('IDまたはパスワードが正しくありません');
            return;
          }
          loadUserData(userId);
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setUserId('');
        setPassword('');
        localStorage.removeItem('app_active_user');
      };

      // ToDo追加/編集
      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        let nextTodos;
        if (editingTodo) {
          nextTodos = todos.map(t => t.id === editingTodo.id ? {
            ...t,
            title: formTitle,
            detail: formDetail,
            startDate: formStartDate,
            endDate: formEndDate,
            time: formTime,
            priority: formPriority,
            tags: formTags,
          } : t);
        } else {
          const newTodo = {
            id: Date.now().toString(),
            listId: selectedListId,
            title: formTitle,
            detail: formDetail,
            startDate: formStartDate,
            endDate: formEndDate,
            time: formTime,
            priority: formPriority,
            tags: formTags,
            completed: false,
          };
          nextTodos = [...todos, newTodo];
        }
        setTodos(nextTodos);
        saveUserData(nextTodos);
        closeModal();
      };

      // 期日再設定（遅延タスクの延期）
      const handleRescheduleTodo = (id, newDate) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, startDate: newDate, endDate: newDate } : t);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      const openModalForCreate = () => {
        if (!selectedListId && lists.length === 0) {
          alert('最初にリストを作成してください。');
          setIsNewListModalOpen(true);
          return;
        }
        setEditingTodo(null);
        setFormTitle('');
        setFormDetail('');
        setFormStartDate(new Date().toISOString().split('T')[0]);
        setFormEndDate(new Date().toISOString().split('T')[0]);
        setFormTime('09:00');
        setFormPriority('中');
        setFormTags([]);
        setIsModalOpen(true);
      };

      const openModalForEdit = (todo) => {
        setEditingTodo(todo);
        setFormTitle(todo.title);
        setFormDetail(todo.detail);
        setFormStartDate(todo.startDate);
        setFormEndDate(todo.endDate);
        setFormTime(todo.time);
        setFormPriority(todo.priority);
        setFormTags(todo.tags);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingTodo(null);
      };

      const deleteTodo = (id) => {
        const nextTodos = todos.filter(t => t.id !== id);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      const toggleComplete = (id) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      const handleAddTag = () => {
        if (newTagInput.trim() && !tags.includes(newTagInput.trim())) {
          const nextTags = [...tags, newTagInput.trim()];
          setTags(nextTags);
          saveUserData(undefined, undefined, nextTags);
          setNewTagInput('');
        }
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        const nextLists = [...lists, newList];
        setLists(nextLists);
        setSelectedListId(newList.id);
        saveUserData(undefined, nextLists, undefined, undefined, newList.id);
        setNewListName('');
        setIsNewListModalOpen(false);
      };

      const handleSaveLocation = (code) => {
        setLocationCode(code);
        saveUserData(undefined, undefined, undefined, code);
      };

      // 優先度の見た目定義
      const getPriorityStyle = (priority) => {
        switch (priority) {
          case '必須': return { border: 'border-l-4 border-l-red-500', badge: 'bg-red-100 text-red-700 font-bold' };
          case '高':   return { border: 'border-l-4 border-l-orange-400', badge: 'bg-orange-100 text-orange-700 font-bold' };
          case '中':   return { border: 'border-l-4 border-l-blue-400', badge: 'bg-blue-100 text-blue-700' };
          default:     return { border: 'border-l-4 border-l-slate-300', badge: 'bg-slate-100 text-slate-600' };
        }
      };

      // フィルタリング
      const currentListTodos = todos.filter(t => t.listId === selectedListId);
      const filteredTodos = currentListTodos.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              t.detail.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = selectedTagFilter === 'すべて' || t.tags.includes(selectedTagFilter);
        return matchesSearch && matchesTag;
      });

      // 日付
      const todayObj = new Date();
      const todayStr = todayObj.toISOString().split('T')[0];
      const todayTodos = currentListTodos.filter(t => t.startDate <= todayStr && t.endDate >= todayStr);
      
      // 遅延タスク（今日以前で未完了）
      const overdueTodos = currentListTodos.filter(t => t.endDate < todayStr && !t.completed);

      const dayOfWeekStr = ['日', '月', '火', '水', '木', '金', '土'][todayObj.getDay()];
      const formattedToday = `${todayObj.getMonth() + 1}月${todayObj.getDate()}日 (${dayOfWeekStr})`;

      // カレンダー
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();

      const calendarDays = [];
      for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(null);
      for (let i = 1; i <= lastDateOfMonth; i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        calendarDays.push({ day: i, dateStr });
      }

      // 未認証画面
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-6 rounded-xl shadow-md w-full max-w-xs border border-slate-200">
              <div className="text-center mb-4">
                <div className="bg-indigo-600 text-white p-2 rounded-lg w-9 h-9 flex items-center justify-center mx-auto mb-2 shadow">
                  <i data-lucide="check-square" className="w-5 h-5"></i>
                </div>
                <h1 className="text-base font-bold text-slate-800">ToDo & カレンダー</h1>
                <p className="text-[11px] text-slate-400 mt-0.5">
                  {authMode === 'login' ? 'ログインしてください' : 'アカウントを新規作成'}
                </p>
              </div>

              {authError && (
                <div className="mb-3 p-2 bg-red-50 border border-red-200 text-red-600 rounded text-[11px] text-center">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-2.5">
                <input
                  type="text"
                  value={userId}
                  onChange={(e) => setUserId(e.target.value)}
                  className="w-full px-3 py-1.5 border rounded-md text-xs outline-none focus:border-indigo-500"
                  placeholder="ユーザーID"
                  required
                />
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3 py-1.5 border rounded-md text-xs outline-none focus:border-indigo-500"
                  placeholder="パスワード"
                  required
                />
                <button type="submit" className="w-full bg-indigo-600 text-white py-1.5 rounded-md text-xs font-semibold hover:bg-indigo-700 shadow">
                  {authMode === 'login' ? 'ログイン' : 'アカウント作成'}
                </button>
              </form>

              <div className="mt-4 text-center border-t pt-3">
                <button
                  type="button"
                  onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }}
                  className="text-indigo-600 hover:underline text-[11px]"
                >
                  {authMode === 'login' ? '新規アカウント登録はこちら' : 'ログイン画面へ戻る'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-xs flex flex-col">
          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between sticky top-0 z-20">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1.5">
                <div className="bg-indigo-600 text-white p-1 rounded-md">
                  <i data-lucide="check-square" className="w-3.5 h-3.5"></i>
                </div>
                <span className="font-bold text-slate-800 text-xs hidden sm:inline">TaskApp</span>
              </div>

              {/* リストドロップダウン */}
              <div className="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded border border-slate-200">
                <span className="text-[10px] text-slate-400">リスト:</span>
                <select
                  value={selectedListId}
                  onChange={(e) => setSelectedListId(e.target.value)}
                  className="bg-transparent font-semibold text-slate-700 outline-none text-xs cursor-pointer"
                >
                  {lists.length === 0 ? (
                    <option value="">(リストなし)</option>
                  ) : (
                    lists.map(l => <option key={l.id} value={l.id}>{l.name}</option>)
                  )}
                </select>
                <button onClick={() => setIsNewListModalOpen(true)} className="text-indigo-600 hover:text-indigo-800 p-0.5" title="新規リスト追加">
                  <i data-lucide="plus" className="w-3 h-3"></i>
                </button>
              </div>
            </div>

            {/* 右側アクション */}
            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setIsSettingsOpen(true)}
                className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-md border border-slate-200"
                title="地域・設定"
              >
                <i data-lucide="settings" className="w-3.5 h-3.5"></i>
              </button>

              <button
                onClick={() => setIsCalendarOpen(true)}
                className="p-1.5 text-slate-600 hover:bg-slate-100 rounded-md border border-slate-200 flex items-center gap-1"
                title="カレンダー"
              >
                <i data-lucide="calendar" className="w-3.5 h-3.5 text-indigo-600"></i>
                <span className="hidden sm:inline text-[11px]">カレンダー</span>
              </button>

              <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 p-1 ml-1" title="ログアウト">
                <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
              </button>
            </div>
          </header>

          {/* ヘッダー直下ナビ/タブ */}
          <div className="bg-white border-b border-slate-200 px-4 py-1.5 flex items-center justify-between">
            <div className="flex gap-1">
              <button
                onClick={() => setActiveTab('today')}
                className={`px-3 py-1 rounded-md font-medium text-[11px] transition ${
                  activeTab === 'today' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50'
                }`}
              >
                ☀️ 本日の予定
              </button>
              <button
                onClick={() => setActiveTab('todos')}
                className={`px-3 py-1 rounded-md font-medium text-[11px] transition ${
                  activeTab === 'todos' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50'
                }`}
              >
                📝 すべてのToDo
              </button>
            </div>

            <button
              onClick={openModalForCreate}
              className="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded-md text-[11px] font-medium flex items-center gap-1 shadow-sm"
            >
              <i data-lucide="plus" className="w-3.5 h-3.5"></i>
              <span>ToDo作成</span>
            </button>
          </div>

          {/* メインエリア */}
          <main className="flex-1 max-w-2xl w-full mx-auto p-3 space-y-3">
            {/* TAB 1: 本日の予定 */}
            {activeTab === 'today' && (
              <div className="space-y-3">
                {/* 今日カード (天気情報) */}
                <div className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm flex items-center justify-between">
                  <div>
                    <div className="text-[10px] font-bold text-indigo-600 tracking-wider">TODAY</div>
                    <div className="text-sm font-extrabold text-slate-800 mt-0.5">{formattedToday}</div>
                  </div>

                  <div className="flex items-center gap-2 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100">
                    <span className="text-base">{weather.icon}</span>
                    <div className="text-right">
                      <div className="text-[10px] font-semibold text-slate-700">{weather.text}</div>
                      <div className="text-[9px] text-slate-400">
                        {PREFECTURES.find(p => p.code === locationCode)?.name || '選択地域'}
                      </div>
                    </div>
                  </div>
                </div>

                {/* 遅延タスクアラート */}
                {overdueTodos.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2">
                    <div className="flex items-center gap-1 text-amber-800 font-bold text-xs">
                      <i data-lucide="alert-circle" className="w-4 h-4 text-amber-600"></i>
                      <span>期限を過ぎたタスク ({overdueTodos.length}件)</span>
                    </div>
                    <div className="space-y-1.5">
                      {overdueTodos.map(todo => (
                        <div key={todo.id} className="bg-white p-2 rounded-lg border border-amber-200 flex items-center justify-between">
                          <div>
                            <span className="font-semibold text-slate-800">{todo.title}</span>
                            <span className="text-[10px] text-amber-600 ml-2">({todo.endDate} 期限)</span>
                          </div>
                          <button
                            onClick={() => handleRescheduleTodo(todo.id, todayStr)}
                            className="bg-amber-600 hover:bg-amber-700 text-white px-2 py-0.5 rounded text-[10px]"
                          >
                            今日に延期
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 本日のToDoリスト */}
                <div className="space-y-2">
                  <span className="font-bold text-slate-700 text-xs px-1">本日の予定 ({todayTodos.length}件)</span>

                  {todayTodos.length === 0 ? (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-400 text-xs">
                      本日の予定はありません。
                    </div>
                  ) : (
                    todayTodos.map(todo => {
                      const style = getPriorityStyle(todo.priority);
                      return (
                        <div key={todo.id} className={`bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-2 ${style.border} ${todo.completed ? 'opacity-50 bg-slate-50' : ''}`}>
                          <div className="flex items-center gap-2 flex-1 min-w-0">
                            <input
                              type="checkbox"
                              checked={todo.completed}
                              onChange={() => toggleComplete(todo.id)}
                              className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                            />
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-1.5">
                                <span className={`font-semibold text-slate-800 truncate ${todo.completed ? 'line-through text-slate-400' : ''}`}>{todo.title}</span>
                                <span className={`text-[9px] px-1.5 py-0.2 rounded ${style.badge}`}>{todo.priority}</span>
                              </div>
                              {todo.detail && <p className="text-[11px] text-slate-500 truncate mt-0.5">{todo.detail}</p>}
                              <div className="flex items-center gap-2 mt-0.5 text-[10px] text-slate-400">
                                <span>🕒 {todo.time}</span>
                                {todo.tags.map(tag => <span key={tag} className="text-slate-500">#{tag}</span>)}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => openModalForEdit(todo)} className="text-slate-400 hover:text-indigo-600 p-1">
                              <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                            </button>
                            <button onClick={() => deleteTodo(todo.id)} className="text-slate-400 hover:text-red-600 p-1">
                              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: すべてのToDo */}
            {activeTab === 'todos' && (
              <div className="space-y-2.5">
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder="検索..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="flex-1 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-indigo-500"
                  />
                  <div className="flex items-center gap-1 overflow-x-auto">
                    <button
                      onClick={() => setSelectedTagFilter('すべて')}
                      className={`px-2 py-1 rounded text-[10px] font-medium whitespace-nowrap ${
                        selectedTagFilter === 'すべて' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600'
                      }`}
                    >
                      すべて
                    </button>
                    {tags.map(tag => (
                      <button
                        key={tag}
                        onClick={() => setSelectedTagFilter(tag)}
                        className={`px-2 py-1 rounded text-[10px] font-medium whitespace-nowrap ${
                          selectedTagFilter === tag ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600'
                        }`}
                      >
                        #{tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2">
                  {filteredTodos.length === 0 ? (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-400 text-xs">
                      ToDoはありません。
                    </div>
                  ) : (
                    filteredTodos.map(todo => {
                      const style = getPriorityStyle(todo.priority);
                      return (
                        <div key={todo.id} className={`bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-2 ${style.border} ${todo.completed ? 'opacity-50 bg-slate-50' : ''}`}>
                          <div className="flex items-center gap-2 flex-1 min-w-0">
                            <input
                              type="checkbox"
                              checked={todo.completed}
                              onChange={() => toggleComplete(todo.id)}
                              className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                            />
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-1.5">
                                <span className={`font-semibold text-slate-800 truncate ${todo.completed ? 'line-through text-slate-400' : ''}`}>{todo.title}</span>
                                <span className={`text-[9px] px-1.5 py-0.2 rounded ${style.badge}`}>{todo.priority}</span>
                              </div>
                              {todo.detail && <p className="text-[11px] text-slate-500 truncate mt-0.5">{todo.detail}</p>}
                              <div className="flex items-center gap-2 mt-0.5 text-[10px] text-slate-400">
                                <span>📅 {todo.startDate} 〜 {todo.endDate}</span>
                                <span>🕒 {todo.time}</span>
                                {todo.tags.map(tag => <span key={tag} className="text-slate-500">#{tag}</span>)}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => openModalForEdit(todo)} className="text-slate-400 hover:text-indigo-600 p-1">
                              <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                            </button>
                            <button onClick={() => deleteTodo(todo.id)} className="text-slate-400 hover:text-red-600 p-1">
                              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}
          </main>

          {/* カレンダーモーダル */}
          {isCalendarOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-xl w-full max-w-sm p-3.5 shadow-xl border border-slate-200">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="font-bold text-slate-800 text-xs">
                    {year}年 {month + 1}月
                  </span>
                  <div className="flex items-center gap-1">
                    <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="px-2 py-0.5 border rounded text-[10px]">前月</button>
                    <button onClick={() => setCurrentDate(new Date())} className="px-2 py-0.5 border rounded text-[10px]">今月</button>
                    <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="px-2 py-0.5 border rounded text-[10px]">次月</button>
                    <button onClick={() => setIsCalendarOpen(false)} className="ml-1 text-slate-400 p-0.5">
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center font-semibold text-slate-400 text-[9px] mb-1">
                  <span className="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {calendarDays.map((item, index) => {
                    if (!item) return <div key={`empty-${index}`} className="h-11 bg-slate-50/50 rounded"></div>;
                    const dayTodos = currentListTodos.filter(t => t.startDate <= item.dateStr && t.endDate >= item.dateStr);

                    return (
                      <div key={item.dateStr} className="h-11 border border-slate-100 bg-white rounded p-1 flex flex-col justify-between overflow-hidden">
                        <span className="text-[9px] font-bold text-slate-600">{item.day}</span>
                        {dayTodos.length > 0 && (
                          <div
                            onClick={() => {
                              setIsCalendarOpen(false);
                              openModalForEdit(dayTodos[0]);
                            }}
                            className="text-[8px] px-1 py-0.2 rounded bg-indigo-50 text-indigo-700 truncate cursor-pointer font-medium"
                          >
                            {dayTodos.length === 1 ? dayTodos[0].title : `${dayTodos.length}件`}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Todo作成・編集モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-xl w-full max-w-sm p-4 shadow-xl border border-slate-200">
                <h2 className="text-xs font-bold text-slate-800 mb-2.5">
                  {editingTodo ? 'ToDoを編集' : '新しいToDoを作成'}
                </h2>
                <form onSubmit={handleSaveTodo} className="space-y-2">
                  <input
                    type="text"
                    value={formTitle}
                    onChange={(e) => setFormTitle(e.target.value)}
                    className="w-full px-2.5 py-1.5 border rounded text-xs outline-none focus:border-indigo-500"
                    placeholder="タイトル"
                    required
                  />

                  <textarea
                    value={formDetail}
                    onChange={(e) => setFormDetail(e.target.value)}
                    className="w-full px-2.5 py-1.5 border rounded text-xs outline-none focus:border-indigo-500 h-14"
                    placeholder="詳細メモ..."
                  />

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[9px] font-semibold text-slate-400 mb-0.5">開始日</label>
                      <input
                        type="date"
                        value={formStartDate}
                        onChange={(e) => setFormStartDate(e.target.value)}
                        className="w-full px-2 py-1 border rounded text-xs outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[9px] font-semibold text-slate-400 mb-0.5">終了日</label>
                      <input
                        type="date"
                        value={formEndDate}
                        onChange={(e) => setFormEndDate(e.target.value)}
                        className="w-full px-2 py-1 border rounded text-xs outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[9px] font-semibold text-slate-400 mb-0.5">時間</label>
                      <input
                        type="time"
                        value={formTime}
                        onChange={(e) => setFormTime(e.target.value)}
                        className="w-full px-2 py-1 border rounded text-xs outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[9px] font-semibold text-slate-400 mb-0.5">重要度</label>
                      <select
                        value={formPriority}
                        onChange={(e) => setFormPriority(e.target.value)}
                        className="w-full px-2 py-1 border rounded text-xs bg-white outline-none"
                      >
                        <option value="低">低</option>
                        <option value="中">中</option>
                        <option value="高">高</option>
                        <option value="必須">必須</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[9px] font-semibold text-slate-400 mb-0.5">タグ</label>
                    <div className="flex flex-wrap gap-1 mb-1">
                      {tags.map(tag => {
                        const isSelected = formTags.includes(tag);
                        return (
                          <button
                            type="button"
                            key={tag}
                            onClick={() => {
                              if (isSelected) setFormTags(formTags.filter(t => t !== tag));
                              else setFormTags([...formTags, tag]);
                            }}
                            className={`px-2 py-0.5 rounded text-[9px] font-medium ${
                              isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                            }`}
                          >
                            #{tag}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex gap-1">
                      <input
                        type="text"
                        placeholder="新規タグ..."
                        value={newTagInput}
                        onChange={(e) => setNewTagInput(e.target.value)}
                        className="flex-1 px-2 py-0.5 border rounded text-[10px] outline-none"
                      />
                      <button type="button" onClick={handleAddTag} className="bg-slate-100 px-2 py-0.5 rounded text-[10px]">追加</button>
                    </div>
                  </div>

                  <div className="flex justify-end gap-1.5 pt-2 border-t mt-2">
                    <button type="button" onClick={closeModal} className="px-3 py-1 border rounded text-xs">キャンセル</button>
                    <button type="submit" className="px-3 py-1 bg-indigo-600 text-white rounded text-xs shadow-sm">保存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 地域設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-xl w-full max-w-xs p-3.5 shadow-xl border border-slate-200">
                <h2 className="text-xs font-bold text-slate-800 mb-2">地域設定 (天気予報)</h2>
                <div className="space-y-3">
                  <div>
                    <label className="block text-[10px] text-slate-400 mb-1">天気表示地域を選択</label>
                    <select
                      value={locationCode}
                      onChange={(e) => handleSaveLocation(e.target.value)}
                      className="w-full px-2 py-1.5 border rounded text-xs bg-white outline-none"
                    >
                      {PREFECTURES.map(p => (
                        <option key={p.code} value={p.code}>{p.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex justify-end pt-1">
                    <button onClick={() => setIsSettingsOpen(false)} className="px-3 py-1 bg-indigo-600 text-white rounded text-xs">閉じる</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 新規リストモーダル */}
          {isNewListModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-xl w-full max-w-xs p-3.5 shadow-xl border border-slate-200">
                <h2 className="text-xs font-bold text-slate-800 mb-2">リスト追加</h2>
                <form onSubmit={handleCreateList} className="space-y-2">
                  <input
                    type="text"
                    value={newListName}
                    onChange={(e) => setNewListName(e.target.value)}
                    className="w-full px-2.5 py-1.5 border rounded text-xs outline-none"
                    placeholder="リスト名"
                    required
                  />
                  <div className="flex justify-end gap-1.5 pt-1">
                    <button type="button" onClick={() => setIsNewListModalOpen(false)} className="px-2.5 py-1 border rounded text-xs">キャンセル</button>
                    <button type="submit" className="px-2.5 py-1 bg-indigo-600 text-white rounded text-xs">作成</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
