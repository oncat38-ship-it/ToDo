<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ToDo & カレンダー App</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.4s, color 0.4s;
    }
    body.theme-simple {
      background-color: #f8fafc;
      color: #1e293b;
    }
    body.theme-animal {
      background-color: #fff5f8;
      color: #5c3d46;
    }
    body.theme-business {
      background-color: #0b0f19;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PREFECTURES = [
      { name: '愛知県 (豊橋/名古屋)', code: '230000' },
      { name: '東京都', code: '130000' },
      { name: '北海道 (札幌)', code: '016000' },
      { name: '宮城県 (仙台)', code: '040000' },
      { name: '大阪府', code: '270000' },
      { name: '広島県', code: '340000' },
      { name: '福岡県', code: '400000' },
      { name: '沖縄県 (那覇)', code: '471000' }
    ];

    function isJapaneseHoliday(year, month, day) {
      const dateStr = `${month}/${day}`;
      const fixedHolidays = ['1/1', '1/2', '1/3', '2/11', '2/23', '4/29', '5/3', '5/4', '5/5', '8/11', '11/3', '11/23'];
      if (fixedHolidays.includes(dateStr)) return true;
      if (month === 3 && (day === 20 || day === 21)) return true;
      if (month === 9 && (day === 22 || day === 23)) return true;
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 1) {
        const weekNum = Math.ceil(day / 7);
        if (month === 1 && weekNum === 2) return true;
        if (month === 9 && weekNum === 3) return true;
        if (month === 10 && weekNum === 2) return true;
      }
      return false;
    }

    function isNonWorkingDay(year, month, day) {
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 0 || dayOfWeek === 6) return true;
      return isJapaneseHoliday(year, month, day);
    }

    function getAdjustedPaydayDateStr(year, month, targetDayNum, adjustmentType) {
      let targetDate = new Date(year, month - 1, parseInt(targetDayNum, 10));
      if (targetDate.getMonth() !== month - 1) {
        targetDate = new Date(year, month, 0);
      }
      let y = targetDate.getFullYear();
      let m = targetDate.getMonth() + 1;
      let d = targetDate.getDate();

      if (adjustmentType === 'none') return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      if (adjustmentType === 'prev') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() - 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      } else if (adjustmentType === 'next') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() + 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      }
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function App() {
      const [authMode, setAuthMode] = useState('login'); 
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');

      const [activeTab, setActiveTab] = useState('today');
      const [theme, setTheme] = useState('simple');

      const [lists, setLists] = useState([]);
      const [selectedListId, setSelectedListId] = useState('');
      const [todos, setTodos] = useState([]);
      const [trash, setTrash] = useState([]);
      const [memos, setMemos] = useState([]); 
      const [tags, setTags] = useState([]);

      const [events, setEvents] = useState([]);
      const [payday, setPayday] = useState('25');
      const [paydayAdjustment, setPaydayAdjustment] = useState('prev');
      const [holidays, setHolidays] = useState([]);
      const [memberNames, setMemberNames] = useState(['自分', '家族']);
      const [locationCode, setLocationCode] = useState('230000');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTagFilter, setSelectedTagFilter] = useState('すべて');
      const [selectedDateFilter, setSelectedDateFilter] = useState('すべて');
      const [sortBy, setSortBy] = useState('created');

      // モーダル関連
      const [isCalendarOpen, setIsCalendarOpen] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isNewListModalOpen, setIsNewListModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTrashOpen, setIsTrashOpen] = useState(false);
      const [isEventModalOpen, setIsEventModalOpen] = useState(false);
      
      const [selectedDayDetailDate, setSelectedDayDetailDate] = useState(null);

      const [formHasDate, setFormHasDate] = useState(true);
      const [formDateMode, setFormDateMode] = useState('range');
      const [formStartDate, setFormStartDate] = useState('');
      const [formEndDate, setFormEndDate] = useState('');
      const [formSpecificDates, setFormSpecificDates] = useState([]);
      const [isPickerOpen, setIsPickerOpen] = useState(false);
      const [pickerYear, setPickerYear] = useState(new Date().getFullYear());
      const [pickerMonth, setPickerMonth] = useState(new Date().getMonth());

      const [selectedTodoIds, setSelectedTodoIds] = useState([]);
      const [newQuickMemo, setNewQuickMemo] = useState('');

      const [editingTodo, setEditingTodo] = useState(null);
      const [editingEvent, setEditingEvent] = useState(null);
      const [editingHoliday, setEditingHoliday] = useState(null);

      const [formTitle, setFormTitle] = useState('');
      const [formDetail, setFormDetail] = useState('');
      const [formHasTime, setFormHasTime] = useState(false);
      const [formTime, setFormTime] = useState('09:00');
      const [formIsEssential, setFormIsEssential] = useState(false); 
      const [formIsLocked, setFormIsLocked] = useState(false); 
      const [formTags, setFormTags] = useState([]);
      const [newTagInput, setNewTagInput] = useState('');
      const [newListName, setNewListName] = useState('');

      const [eventFormType, setEventFormType] = useState('event');
      const [eventTitle, setEventTitle] = useState('');
      const [eventIcon, setEventIcon] = useState('🎉');
      const [eventDate, setEventDate] = useState(new Date().toISOString().split('T')[0]);
      const [holidayMember, setHolidayMember] = useState('自分');
      const [newMemberInput, setNewMemberInput] = useState('');

      const [currentDate, setCurrentDate] = useState(new Date());
      const [weather, setWeather] = useState({ text: '読み込み中...', icon: '🌤️' });

      useEffect(() => {
        const sessionUser = localStorage.getItem('app_active_user');
        if (sessionUser) loadUserData(sessionUser);
      }, []);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      useEffect(() => { document.body.className = `theme-${theme}`; }, [theme]);

      useEffect(() => {
        if (!isLoggedIn) return;
        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${locationCode}.json`)
          .then(res => res.json())
          .then(data => {
            const todayWeather = data[0].timeSeries[0].areas[0].weathers[0];
            let icon = '☀️';
            if (todayWeather.includes('雨')) icon = '🌧️';
            else if (todayWeather.includes('くもり') || todayWeather.includes('曇')) icon = '☁️';
            else if (todayWeather.includes('雪')) icon = '❄️';
            setWeather({ text: todayWeather.split('　')[0], icon });
          })
          .catch(() => setWeather({ text: '晴れ時々くもり', icon: '🌤️' }));
      }, [locationCode, isLoggedIn]);

      const loadUserData = (id) => {
        const rawData = localStorage.getItem(`app_data_${id}`);
        if (rawData) {
          const data = JSON.parse(rawData);
          setLists(data.lists || []);
          setSelectedListId(data.selectedListId || (data.lists && data.lists[0]?.id) || '');
          setTodos(data.todos || []);
          const now = Date.now();
          setTrash((data.trash || []).filter(item => (now - item.deletedAt) < 24 * 60 * 60 * 1000));
          setMemos(data.memos || []);
          setTags(data.tags || []);
          setLocationCode(data.locationCode || '230000');
          setTheme(data.theme || 'simple');
          setEvents(data.events || []);
          setPayday(data.payday || '25');
          setPaydayAdjustment(data.paydayAdjustment || 'prev');
          setHolidays(data.holidays || []);
          setMemberNames(data.memberNames || ['自分', '家族']);
        } else {
          setLists([]); setSelectedListId(''); setTodos([]); setTrash([]); setMemos([]); setTags([]);
          setLocationCode('230000'); setTheme('simple'); setEvents([]); setPayday('25'); setPaydayAdjustment('prev'); setHolidays([]); setMemberNames(['自分', '家族']);
        }
        setUserId(id);
        setIsLoggedIn(true);
        localStorage.setItem('app_active_user', id);
      };

      const saveUserData = (
        updatedTodos, updatedLists, updatedTags, updatedLocation, updatedSelectedListId, updatedMemos, updatedTrash,
        updatedEvents, updatedPayday, updatedHolidays, updatedMembers, updatedPaydayAdj, updatedTheme
      ) => {
        if (!userId) return;
        const dataToSave = {
          lists: updatedLists !== undefined ? updatedLists : lists,
          selectedListId: updatedSelectedListId !== undefined ? updatedSelectedListId : selectedListId,
          todos: updatedTodos !== undefined ? updatedTodos : todos,
          trash: updatedTrash !== undefined ? updatedTrash : trash,
          memos: updatedMemos !== undefined ? updatedMemos : memos,
          tags: updatedTags !== undefined ? updatedTags : tags,
          locationCode: updatedLocation !== undefined ? updatedLocation : locationCode,
          theme: updatedTheme !== undefined ? updatedTheme : theme,
          events: updatedEvents !== undefined ? updatedEvents : events,
          payday: updatedPayday !== undefined ? updatedPayday : payday,
          paydayAdjustment: updatedPaydayAdj !== undefined ? updatedPaydayAdj : paydayAdjustment,
          holidays: updatedHolidays !== undefined ? updatedHolidays : holidays,
          memberNames: updatedMembers !== undefined ? updatedMembers : memberNames
        };
        localStorage.setItem(`app_data_${userId}`, JSON.stringify(dataToSave));
      };

      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        const storedUsers = JSON.parse(localStorage.getItem('app_users_db') || '{}');
        if (authMode === 'signup') {
          if (storedUsers[userId]) { setAuthError('このIDは既に登録されています'); return; }
          storedUsers[userId] = password;
          localStorage.setItem('app_users_db', JSON.stringify(storedUsers));
          loadUserData(userId);
        } else {
          if (!storedUsers[userId] || storedUsers[userId] !== password) {
            setAuthError('IDまたはパスワードが正しくありません');
            return;
          }
          loadUserData(userId);
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false); setUserId(''); setPassword('');
        localStorage.removeItem('app_active_user');
      };

      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        let nextTodos;
        const todoPayload = {
          title: formTitle,
          detail: formDetail,
          hasDate: formHasDate,
          dateMode: formDateMode,
          startDate: formHasDate && formDateMode === 'range' ? formStartDate : '',
          endDate: formHasDate && formDateMode === 'range' ? (formEndDate || formStartDate) : '',
          specificDates: formHasDate && formDateMode === 'specific' ? formSpecificDates : [],
          hasTime: formHasTime,
          time: formHasTime ? formTime : '',
          isEssential: formIsEssential,
          isLocked: formIsLocked,
          tags: formTags,
        };

        if (editingTodo) {
          nextTodos = todos.map(t => t.id === editingTodo.id ? { ...t, ...todoPayload } : t);
        } else {
          const newTodo = {
            id: Date.now().toString(),
            listId: selectedListId,
            ...todoPayload,
            completed: false,
          };
          nextTodos = [...todos, newTodo];
        }
        setTodos(nextTodos);
        saveUserData(nextTodos);
        closeModal();
      };

      const isTodoActiveOnDate = (todo, dateStr) => {
        if (!todo.hasDate) return false;
        if (todo.dateMode === 'specific') {
          return todo.specificDates && todo.specificDates.includes(dateStr);
        } else {
          const s = todo.startDate || dateStr;
          const e = todo.endDate || s;
          return dateStr >= s && dateStr <= e;
        }
      };

      const handleSaveEventOrHoliday = (e) => {
        e.preventDefault();
        if (eventFormType === 'event') {
          if (!eventTitle.trim()) return;
          let nextEvents;
          if (editingEvent) {
            nextEvents = events.map(ev => ev.id === editingEvent.id ? { ...ev, title: eventTitle.trim(), date: eventDate, icon: eventIcon || '🎉' } : ev);
          } else {
            nextEvents = [...events, { id: Date.now().toString(), title: eventTitle.trim(), date: eventDate, icon: eventIcon || '🎉' }];
          }
          setEvents(nextEvents);
          saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, nextEvents);
        } else {
          let nextHolidays;
          if (editingHoliday) {
            nextHolidays = holidays.map(hol => hol.id === editingHoliday.id ? { ...hol, memberName: holidayMember, date: eventDate } : hol);
          } else {
            nextHolidays = [...holidays, { id: Date.now().toString(), memberName: holidayMember, date: eventDate }];
          }
          setHolidays(nextHolidays);
          saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, nextHolidays);
        }
        setIsEventModalOpen(false);
        setEditingEvent(null); setEditingHoliday(null); setEventTitle('');
      };

      const deleteEvent = (id) => {
        const nextEvents = events.filter(e => e.id !== id);
        setEvents(nextEvents);
        saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, nextEvents);
        if (editingEvent && editingEvent.id === id) { setIsEventModalOpen(false); setEditingEvent(null); }
      };

      const deleteHoliday = (id) => {
        const nextHolidays = holidays.filter(h => h.id !== id);
        setHolidays(nextHolidays);
        saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, nextHolidays);
        if (editingHoliday && editingHoliday.id === id) { setIsEventModalOpen(false); setEditingHoliday(null); }
      };

      const deleteTodo = (id) => {
        const target = todos.find(t => t.id === id);
        if (!target) return;
        if (target.isLocked) { alert('🔒 ロックされているため削除できません。'); return; }
        const nextTodos = todos.filter(t => t.id !== id);
        const nextTrash = [{ ...target, deletedAt: Date.now() }, ...trash];
        setTodos(nextTodos); setTrash(nextTrash);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
        if (editingTodo && editingTodo.id === id) closeModal();
      };

      const restoreFromTrash = (id) => {
        const target = trash.find(t => t.id === id);
        if (!target) return;
        const { deletedAt, ...todoData } = target;
        const nextTrash = trash.filter(t => t.id !== id);
        const nextTodos = [...todos, todoData];
        setTodos(nextTodos); setTrash(nextTrash);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      const permanentlyDeleteFromTrash = (id) => {
        const nextTrash = trash.filter(t => t.id !== id);
        setTrash(nextTrash);
        saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      const handleBulkDelete = () => {
        if (selectedTodoIds.length === 0) return;
        const targets = todos.filter(t => selectedTodoIds.includes(t.id) && !t.isLocked);
        if (targets.length === 0) return;
        const deletableIds = targets.map(t => t.id);
        const nextTodos = todos.filter(t => !deletableIds.includes(t.id));
        const nextTrash = [...targets.map(t => ({ ...t, deletedAt: Date.now() })), ...trash];
        setTodos(nextTodos); setTrash(nextTrash); setSelectedTodoIds([]);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      const toggleTodoSelect = (id) => {
        if (selectedTodoIds.includes(id)) setSelectedTodoIds(selectedTodoIds.filter(i => i !== id));
        else setSelectedTodoIds([...selectedTodoIds, id]);
      };

      const toggleLockTodo = (id) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, isLocked: !t.isLocked } : t);
        setTodos(nextTodos); saveUserData(nextTodos);
      };

      const handleAddMemo = (targetDate = null) => {
        if (!newQuickMemo.trim()) return;
        const nextMemos = [{ id: Date.now().toString(), text: newQuickMemo.trim(), date: targetDate || '', completed: false }, ...memos];
        setMemos(nextMemos); saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
        setNewQuickMemo('');
      };

      const toggleMemoComplete = (id) => {
        const nextMemos = memos.map(m => m.id === id ? { ...m, completed: !m.completed } : m);
        setMemos(nextMemos); saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
      };

      const deleteMemo = (id) => {
        const nextMemos = memos.filter(m => m.id !== id);
        setMemos(nextMemos); saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
      };

      const promoteMemoToTodo = (memo) => {
        if (!selectedListId && lists.length === 0) { alert('先にリストを作成してください。'); setIsNewListModalOpen(true); return; }
        deleteMemo(memo.id);
        setEditingTodo(null);
        setFormTitle(memo.text); setFormDetail('');
        setFormHasDate(true); setFormDateMode('range');
        const todayStr = new Date().toISOString().split('T')[0];
        setFormStartDate(memo.date || todayStr); setFormEndDate(memo.date || todayStr);
        setFormSpecificDates([]);
        setFormHasTime(false); setFormTime('09:00');
        setFormIsEssential(false); setFormIsLocked(false); setFormTags([]);
        setIsModalOpen(true);
      };

      const openModalForCreateFromDate = (targetDateStr) => {
        if (!selectedListId && lists.length === 0) { alert('先にリストを作成してください。'); setIsNewListModalOpen(true); return; }
        setEditingTodo(null);
        setFormTitle(''); setFormDetail('');
        setFormHasDate(true); setFormDateMode('range');
        setFormStartDate(targetDateStr); setFormEndDate(targetDateStr);
        setFormSpecificDates([]);
        setFormHasTime(false); setFormTime('09:00');
        setFormIsEssential(false); setFormIsLocked(false); setFormTags([]);
        setIsModalOpen(true);
      };

      const openEventModalFromDate = (targetDateStr) => {
        setEditingEvent(null);
        setEditingHoliday(null);
        setEventTitle('');
        setEventDate(targetDateStr);
        setIsEventModalOpen(true);
      };

      const openModalForCreate = () => {
        openModalForCreateFromDate(new Date().toISOString().split('T')[0]);
      };

      const openModalForEdit = (todo) => {
        setEditingTodo(todo);
        setFormTitle(todo.title); setFormDetail(todo.detail);
        setFormHasDate(todo.hasDate !== false);
        setFormDateMode(todo.dateMode || 'range');
        setFormStartDate(todo.startDate || new Date().toISOString().split('T')[0]);
        setFormEndDate(todo.endDate || new Date().toISOString().split('T')[0]);
        setFormSpecificDates(todo.specificDates || []);
        setFormHasTime(!!todo.hasTime); setFormTime(todo.time || '09:00');
        setFormIsEssential(!!todo.isEssential); setFormIsLocked(!!todo.isLocked);
        setFormTags(todo.tags || []);
        setIsModalOpen(true);
      };

      const closeModal = () => { setIsModalOpen(false); setEditingTodo(null); };

      const toggleComplete = (id) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        setTodos(nextTodos); saveUserData(nextTodos);
      };

      const handleAddTag = () => {
        if (newTagInput.trim() && !tags.includes(newTagInput.trim())) {
          const nextTags = [...tags, newTagInput.trim()];
          setTags(nextTags); saveUserData(undefined, undefined, nextTags);
          setNewTagInput('');
        }
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        const nextLists = [...lists, newList];
        setLists(nextLists); setSelectedListId(newList.id);
        saveUserData(undefined, nextLists, undefined, undefined, newList.id);
        setNewListName(''); setIsNewListModalOpen(false);
      };

      const handleSaveLocation = (code) => { setLocationCode(code); saveUserData(undefined, undefined, undefined, code); };
      const handleSaveTheme = (th) => { setTheme(th); saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, th); };
      const handleSavePayday = (pd, adj) => { setPayday(pd); setPaydayAdjustment(adj); saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, pd, undefined, undefined, adj); };

      const handlePickerDateClick = (dateStr) => {
        if (formDateMode === 'range') {
          if (formStartDate === dateStr && formEndDate === dateStr) {
            setFormStartDate(''); setFormEndDate('');
          } else if (formStartDate === dateStr && !formEndDate) {
            setFormStartDate('');
          } else if (formEndDate === dateStr) {
            setFormEndDate('');
          } else if (!formStartDate) {
            setFormStartDate(dateStr);
          } else if (!formEndDate) {
            if (dateStr < formStartDate) {
              setFormEndDate(formStartDate);
              setFormStartDate(dateStr);
            } else {
              setFormEndDate(dateStr);
            }
          } else {
            setFormStartDate(dateStr);
            setFormEndDate('');
          }
        } else {
          if (formSpecificDates.includes(dateStr)) {
            setFormSpecificDates(formSpecificDates.filter(d => d !== dateStr));
          } else {
            setFormSpecificDates([...formSpecificDates, dateStr].sort());
          }
        }
      };

      const todayObj = new Date();
      const todayStr = todayObj.toISOString().split('T')[0];
      const currentYear = todayObj.getFullYear();
      const currentMonth = todayObj.getMonth() + 1;
      const calculatedPaydayStr = getAdjustedPaydayDateStr(currentYear, currentMonth, payday, paydayAdjustment);
      const isTodayPayday = calculatedPaydayStr === todayStr;

      const currentListTodos = todos.filter(t => t.listId === selectedListId);
      const filteredTodos = currentListTodos.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.detail.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = selectedTagFilter === 'すべて' || (t.tags && t.tags.includes(selectedTagFilter));
        let matchesDate = true;
        if (selectedDateFilter === 'today') {
          matchesDate = isTodoActiveOnDate(t, todayStr);
        } else if (selectedDateFilter === 'this_week') {
          const weekLaterObj = new Date(); weekLaterObj.setDate(weekLaterObj.getDate() + 7);

        } else if (selectedDateFilter === 'no_date') {
          matchesDate = t.hasDate === false;
        }
        return matchesSearch && matchesTag && matchesDate;
      }).sort((a, b) => {
        if (sortBy === 'essential') return (b.isEssential ? 1 : 0) - (a.isEssential ? 1 : 0);
        else if (sortBy === 'date') {
          if (!a.hasDate) return 1; if (!b.hasDate) return -1;
          return (a.startDate || '').localeCompare(b.startDate || '');
        } else return b.id.localeCompare(a.id);

                  <div className="flex justify-end gap-2 pt-3 border-t border-black/10 dark:border-slate-800 mt-3">
                    <button type="button" onClick={closeModal} className="px-4 py-2 border border-black/10 dark:border-slate-700 rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-bold shadow-md ${themeStyles.primaryBtn}`}>保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* イベント / 休日登録・編集モーダル */}
          {isEventModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-3xl w-full max-w-sm p-5 shadow-2xl border border-black/10 dark:border-slate-800 space-y-3.5">
                <div className="flex items-center justify-between border-b border-black/10 dark:border-slate-800 pb-2.5">
                  <h2 className="text-xs font-bold">{editingEvent || editingHoliday ? '🎉 予定・休日の編集' : '🎉 予定・休日設定'}</h2>
                  <div className="flex items-center gap-1">
                    {(editingEvent || editingHoliday) && (
                      <button type="button" onClick={() => { if (editingEvent) deleteEvent(editingEvent.id); if (editingHoliday) deleteHoliday(editingHoliday.id); }} className="text-rose-500 hover:bg-rose-500/10 px-2.5 py-1 rounded-xl text-[10px] font-bold">削除</button>
                    )}
                    <button onClick={() => { setIsEventModalOpen(false); setEditingEvent(null); setEditingHoliday(null); }} className="opacity-60 hover:opacity-100 p-1"><i data-lucide="x" className="w-4 h-4"></i></button>
                  </div>
                </div>

                {!editingEvent && !editingHoliday && (
                  <div className="flex bg-black/5 dark:bg-slate-950 p-1 rounded-2xl font-bold">
                    <button type="button" onClick={() => setEventFormType('event')} className={`flex-1 py-1.5 rounded-xl transition ${eventFormType === 'event' ? 'bg-white dark:bg-slate-800 shadow-xs' : 'opacity-60'}`}>特別イベント</button>
                    <button type="button" onClick={() => setEventFormType('holiday')} className={`flex-1 py-1.5 rounded-xl transition ${eventFormType === 'holiday' ? 'bg-white dark:bg-slate-800 shadow-xs' : 'opacity-60'}`}>メンバー休日</button>
                  </div>
                )}

                <form onSubmit={handleSaveEventOrHoliday} className="space-y-3 pt-1">
                  <div>
                    <label className="block text-[10px] font-bold opacity-60 mb-1">対象日付</label>
                    <input type="date" value={eventDate} onChange={(e) => setEventDate(e.target.value)} className="w-full px-3.5 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-sm outline-none font-bold" required />
                  </div>
                  {eventFormType === 'event' ? (
                    <>
                      <div>
                        <label className="block text-[10px] font-bold opacity-60 mb-1">アイコン絵文字</label>
                        <div className="flex items-center gap-2">
                          <input type="text" maxLength="2" value={eventIcon} onChange={(e) => setEventIcon(e.target.value)} className="w-12 text-center py-1.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-lg font-bold" />
                          <div className="flex gap-1 overflow-x-auto py-1">
                            {['🎉', '🎂', '🎤', '✈️', '🚗', '💍', '🏀', '🐾', '🐶', '🐱'].map(emoji => (
                              <button type="button" key={emoji} onClick={() => setEventIcon(emoji)} className="px-2 py-1 bg-black/5 dark:bg-slate-800 rounded-xl text-base hover:opacity-80">{emoji}</button>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold opacity-60 mb-1">イベント名</label>
                        <input type="text" value={eventTitle} onChange={(e) => setEventTitle(e.target.value)} className="w-full px-3.5 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-sm outline-none font-bold" placeholder="例: ○○ライブ、誕生日..." required />
                      </div>
                    </>
                  ) : (
                    <div>
                      <label className="block text-[10px] font-bold opacity-60 mb-1">お休みのメンバー</label>
                      <select value={holidayMember} onChange={(e) => setHolidayMember(e.target.value)} className="w-full px-3 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-sm font-bold mb-2 outline-none">
                        {memberNames.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                      <div className="flex gap-1.5">
                        <input type="text" placeholder="メンバー追加..." value={newMemberInput} onChange={(e) => setNewMemberInput(e.target.value)} className="flex-1 px-3.5 py-2 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-xs outline-none" />
                        <button type="button" onClick={() => { if (newMemberInput.trim() && !memberNames.includes(newMemberInput.trim())) { setMemberNames([...memberNames, newMemberInput.trim()]); setHolidayMember(newMemberInput.trim()); setNewMemberInput(''); } }} className="bg-black/10 dark:bg-slate-800 px-3 py-2 rounded-2xl text-xs font-bold shrink-0">追加</button>
                      </div>
                    </div>
                  )}
                  <div className="flex justify-end gap-2 pt-3 border-t border-black/10 dark:border-slate-800">
                    <button type="button" onClick={() => { setIsEventModalOpen(false); setEditingEvent(null); setEditingHoliday(null); }} className="px-4 py-2 border border-black/10 dark:border-slate-700 rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-bold ${themeStyles.primaryBtn}`}>保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-3xl w-full max-w-xs p-5 shadow-2xl border border-black/10 dark:border-slate-800 space-y-4">
                <div className="flex items-center justify-between border-b border-black/10 dark:border-slate-800 pb-2.5">
                  <h2 className="text-xs font-bold">設定・テーマ変更</h2>
                  <button onClick={() => setIsSettingsOpen(false)} className="opacity-60 hover:opacity-100 p-1"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="space-y-2">
                  <label className="block text-[10px] font-bold opacity-60">🎨 デザインテーマ</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => handleSaveTheme('simple')} className={`p-2.5 rounded-2xl text-xs font-bold border transition text-center ${theme === 'simple' ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-black/5 dark:bg-slate-800 border-transparent'}`}>⚪ シンプル</button>
                    <button onClick={() => handleSaveTheme('animal')} className={`p-2.5 rounded-2xl text-xs font-bold border transition text-center ${theme === 'animal' ? 'bg-rose-400 text-white border-rose-400 shadow-sm' : 'bg-pink-50 dark:bg-slate-800 border-transparent text-rose-800 dark:text-rose-300'}`}>🐾 アニマル</button>
                    <button onClick={() => handleSaveTheme('business')} className={`p-2.5 rounded-2xl text-xs font-bold border transition text-center ${theme === 'business' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-black/5 dark:bg-slate-800 border-transparent'}`}>💼 ビジネス</button>
                  </div>
                </div>
                <div className="space-y-1.5 pt-2 border-t border-black/10 dark:border-slate-800">
                  <label className="block text-[10px] font-bold opacity-60">天気予報の地域設定</label>
                  <select value={locationCode} onChange={(e) => handleSaveLocation(e.target.value)} className="w-full px-3.5 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-xs font-bold outline-none">
                    {PREFECTURES.map(p => <option key={p.code} value={p.code}>{p.name}</option>)}
                  </select>
                </div>
                <div className="space-y-2 pt-2 border-t border-black/10 dark:border-slate-800">
                  <label className="block text-[10px] font-bold opacity-60">毎月の給料日 & 休日の補正設定</label>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-bold">毎月</span>
                    <input type="number" min="1" max="31" value={payday} onChange={(e) => handleSavePayday(e.target.value, paydayAdjustment)} className="w-16 px-3 py-1.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-xl text-xs font-bold outline-none text-center" />
                    <span className="text-xs font-bold">日</span>
                  </div>
                  <select value={paydayAdjustment} onChange={(e) => handleSavePayday(payday, e.target.value)} className="w-full px-3 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-xs font-bold outline-none">
                    <option value="prev">⏪ 前倒し (直前の平日に変更)</option>
                    <option value="next">⏩ 後送り (直後の平日に変更)</option>
                    <option value="none">そのまま (日付通り)</option>
                  </select>
                </div>
                <div className="pt-2 border-t border-black/10 dark:border-slate-800 space-y-1.5">
                  <label className="block text-[10px] font-bold opacity-60">ゴミ箱（24時間保管）</label>
                  <button onClick={() => setIsTrashOpen(true)} className="w-full bg-black/5 dark:bg-slate-800 hover:opacity-80 font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="trash-2" className="w-4 h-4 text-rose-500"></i>ゴミ箱を開く ({trash.length}件)
                  </button>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setIsSettingsOpen(false)} className={`px-4 py-2 rounded-xl text-xs font-bold ${themeStyles.primaryBtn}`}>閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* ゴミ箱モーダル */}
          {isTrashOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-3xl w-full max-w-sm p-5 shadow-2xl border border-black/10 dark:border-slate-800 space-y-3.5">
                <div className="flex items-center justify-between border-b border-black/10 dark:border-slate-800 pb-2.5">
                  <div className="flex items-center gap-1.5"><i data-lucide="trash-2" className="w-4 h-4 text-rose-500"></i><h2 className="text-xs font-bold">ゴミ箱 (24時間以内復元可)</h2></div>
                  <button onClick={() => setIsTrashOpen(false)} className="opacity-60 hover:opacity-100 p-1"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {trash.length === 0 ? <div className="p-8 text-center opacity-40 text-xs">ゴミ箱は空です。</div> : (
                    trash.map(item => (
                      <div key={item.id} className="bg-black/5 dark:bg-slate-800 p-3 rounded-2xl border border-black/5 dark:border-slate-700 flex items-center justify-between">
                        <div className="min-w-0 flex-1 mr-2">
                          <p className="font-bold text-xs truncate">{item.title}</p>
                          <p className="text-[9px] opacity-50">削除: {new Date(item.deletedAt).toLocaleTimeString()}</p>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                          <button onClick={() => restoreFromTrash(item.id)} className="bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-xl text-[10px] font-bold">復元</button>
                          <button onClick={() => permanentlyDeleteFromTrash(item.id)} className="opacity-40 hover:text-rose-500 p-1" title="完全削除"><i data-lucide="x" className="w-4 h-4"></i></button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div className="flex justify-end pt-1"><button onClick={() => setIsTrashOpen(false)} className="px-4 py-2 bg-slate-900 dark:bg-slate-800 text-white rounded-xl text-xs font-bold">閉じる</button></div>
              </div>
            </div>
          )}

          {/* 新規リスト作成モーダル */}
          {isNewListModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-3xl w-full max-w-xs p-5 shadow-2xl border border-black/10 dark:border-slate-800 space-y-3.5">
                <h2 className="text-xs font-bold">新規リスト作成</h2>
                <form onSubmit={handleCreateList} className="space-y-3">
                  <input type="text" value={newListName} onChange={(e) => setNewListName(e.target.value)} className="w-full px-3.5 py-2.5 bg-black/5 dark:bg-slate-950 border border-black/10 dark:border-slate-800 rounded-2xl text-sm outline-none font-bold" placeholder="リスト名" required />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsNewListModalOpen(false)} className="px-4 py-2 border border-black/10 dark:border-slate-700 rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-bold ${themeStyles.primaryBtn}`}>作成</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
