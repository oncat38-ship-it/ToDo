    function isJapaneseHoliday(year, month, day) {
      const dateStr = `${month}/${day}`;
      const fixedHolidays = ['1/1', '1/2', '1/3', '2/11', '2/23', '4/29', '5/3', '5/4', '5/5', '8/11', '11/3', '11/23'];
      if (fixedHolidays.includes(dateStr)) return true;
      if (month === 3 && (day === 20 || day === 21)) return true;
      if (month === 9 && (day === 22 || day === 23)) return true;
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 1) {
        const weekNum = Math.ceil(day / 7);
        if (month === 1 && weekNum === 2) return true;
        if (month === 9 && weekNum === 3) return true;
        if (month === 10 && weekNum === 2) return true;
      }
      return false;
    }

    function isNonWorkingDay(year, month, day) {
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 0 || dayOfWeek === 6) return true;
      return isJapaneseHoliday(year, month, day);
    }

    function getAdjustedPaydayDateStr(year, month, targetDayNum, adjustmentType) {
      let targetDate = new Date(year, month - 1, parseInt(targetDayNum, 10));
      if (targetDate.getMonth() !== month - 1) {
        targetDate = new Date(year, month, 0);
      }
      let y = targetDate.getFullYear();
      let m = targetDate.getMonth() + 1;
      let d = targetDate.getDate();

      if (adjustmentType === 'none') return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      if (adjustmentType === 'prev') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() - 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      } else if (adjustmentType === 'next') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() + 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      }
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function App() {

        const checkFirebaseReady = setInterval(() => {
          if (window.firebaseApp) {
            clearInterval(checkFirebaseReady);
            const { auth, onAuthStateChanged, db, doc, onSnapshot } = window.firebaseApp;

              if (user) {

                setIsLoggedIn(true);

                const docRef = doc(db, "users", user.uid);

                  if (docSnap.exists()) {
                    const data = docSnap.data();

                    if (data.selectedListId) setSelectedListId(data.selectedListId);
                    if (data.todos) setTodos(data.todos);
                    if (data.trash) setTrash(data.trash);
                    if (data.memos) setMemos(data.memos);
                    if (data.tags) setTags(data.tags);
                    if (data.locationCode) setLocationCode(data.locationCode);
                    if (data.theme) setTheme(data.theme);
                    if (data.events) setEvents(data.events);
                    if (data.workHours) setWorkHours(data.workHours);
                    if (data.defaultWorkStart) setDefaultWorkStart(data.defaultWorkStart);
                    if (data.defaultWorkEnd) setDefaultWorkEnd(data.defaultWorkEnd);
                    if (data.payday) setPayday(data.payday);
                    if (data.paydayAdjustment) setPaydayAdjustment(data.paydayAdjustment);
                    if (data.holidays) setHolidays(data.holidays);
                    if (data.memberNames) setMemberNames(data.memberNames);
                    if (data.essentialNoticeDays) setEssentialNoticeDays(data.essentialNoticeDays);
                  } else {

                      lists: [{ id: '1', name: 'メインリスト' }],
                      selectedListId: '1',
                      todos: [],
                      trash: [],
                      memos: [],
                      tags: ['仕事', 'プライベート'],
                      locationCode: '230000',
                      theme: 'simple',
                      events: [],
                      workHours: {},
                      defaultWorkStart: '09:00',
                      defaultWorkEnd: '18:00',
                      payday: '25',
                      paydayAdjustment: 'prev',
                      holidays: [],
                      memberNames: ['自分', '家族'],
                      essentialNoticeDays: 7
                    };
                    setDoc(docRef, defaultData);
                  }
                });
              } else {
                setCurrentUser(null);
                setIsLoggedIn(false);
              }
            });
          }
        }, 100);
      }, []);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      useEffect(() => { document.body.className = `theme-${theme}`; }, [theme]);

      useEffect(() => {
        if (!isLoggedIn) return;
        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${locationCode}.json`)
          .then(res => res.json())
          .then(data => {
            const todayWeather = data[0].timeSeries[0].areas[0].weathers[0];
            let icon = '☀️';
            if (todayWeather.includes('雨')) icon = '🌧️';
            else if (todayWeather.includes('くもり') || todayWeather.includes('曇')) icon = '☁️';
            else if (todayWeather.includes('雪')) icon = '❄️';
            setWeather({ text: todayWeather.split('　')[0], icon });
          })
          .catch(() => setWeather({ text: '晴れ時々くもり', icon: '🌤️' }));
      }, [locationCode, isLoggedIn]);

      const saveUserDataToFirebase = async (overrides = {}) => {
        if (!currentUser) return;
        const { db, doc, setDoc } = window.firebaseApp;
        const docRef = doc(db, "users", currentUser.uid);
        
        const payload = {
          lists, selectedListId, todos, trash, memos, tags, locationCode,
          theme, events, workHours, defaultWorkStart, defaultWorkEnd, payday, paydayAdjustment, holidays,
          memberNames, essentialNoticeDays, ...overrides
        };

        await setDoc(docRef, payload, { merge: true });
      };

      const formatEmailFromId = (id) => `${id.trim().toLowerCase()}@app.local`;

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanId = customIdInput.trim();
        const cleanPass = passwordInput.trim();

        if (!cleanId || !cleanPass) {
          setAuthError('IDとパスワードを入力してください');
          return;
        }

        if (cleanPass.length < 6) {
          setAuthError('パスワードは6文字以上で入力してください');
          return;
        }

        const internalEmail = formatEmailFromId(cleanId);
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseApp;

        try {
          if (authMode === 'signup') {
            await createUserWithEmailAndPassword(auth, internalEmail, cleanPass);
          } else {
            await signInWithEmailAndPassword(auth, internalEmail, cleanPass);
          }
        } catch (err) {
          const code = err.code || '';
          if (code === 'auth/operation-not-allowed') {
            setAuthError('⚠️ Firebase Consoleで「メール/パスワード認証」が無効になっています。設定を有効にしてください。');
          } else if (code === 'auth/email-already-in-use') {
            setAuthError('このIDは既に使用されています。別のIDをお試しください。');
          } else if (code === 'auth/invalid-credential' || code === 'auth/user-not-found' || code === 'auth/wrong-password') {
            setAuthError('IDまたはパスワードが正しくありません。');
          } else {
            setAuthError(`エラー (${code || err.message})`);
          }
        }
      };

          setAccountMsg('❌ パスワードは6文字以上で入力してください');

          await updatePassword(currentUser, newPasswordInput.trim());

        e.preventDefault();
        if (!feedbackInput.trim()) return;
        const { db, collection, addDoc } = window.firebaseApp;

            userId: currentUser.email.replace('@app.local', ''),

        setDefaultWorkStart(start);

      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        const todoPayload = {
          title: formTitle,
          detail: formDetail,
          hasDate: formHasDate,
          dateMode: formDateMode,
          startDate: formHasDate && formDateMode === 'range' ? formStartDate : '',

          time: formHasTime ? formTime : '',

          isLocked: formIsLocked,
          tags: formTags,

        if (!todo.hasDate) return false;
        if (todo.dateMode === 'specific') {
          return todo.specificDates && todo.specificDates.includes(dateStr);
        } else {
          const s = todo.startDate || dateStr;
          const e = todo.endDate || s;
          return dateStr >= s && dateStr <= e;
        }
      };

        e.preventDefault();
        if (eventFormType === 'event') {
          if (!eventTitle.trim()) return;
          let nextEvents;
          if (editingEvent) {
            nextEvents = events.map(ev => ev.id === editingEvent.id ? { ...ev, title: eventTitle.trim(), date: eventDate, icon: eventIcon || '🎉' } : ev);

            nextEvents = [...events, { id: Date.now().toString(), title: eventTitle.trim(), date: eventDate, icon: eventIcon || '🎉' }];

          saveUserDataToFirebase({ events: nextEvents });

          saveUserDataToFirebase({ holidays: nextHolidays });

        setHolidays(nextHolidays);
        saveUserDataToFirebase({ holidays: nextHolidays });

        if (!target) return;
        if (target.isLocked) { alert('🔒 ロックされています。'); return; }
        const nextTodos = todos.filter(t => t.id !== id);

        saveUserDataToFirebase({ todos: nextTodos });

        setTodos(nextTodos);
        saveUserDataToFirebase({ todos: nextTodos });

      const handleAddMemo = (targetDate = null) => {

        const nextMemos = [{ id: Date.now().toString(), text: newQuickMemo.trim(), date: targetDate || '', completed: false }, ...memos];

        setMemos(nextMemos);
        saveUserDataToFirebase({ memos: nextMemos });

        deleteMemo(memo.id);

        setIsModalOpen(true);
      };

      const openModalForCreateFromDate = (targetDateStr) => {
        setEditingTodo(null);
        setFormTitle(''); setFormDetail('');
        setFormHasDate(true); setFormDateMode('range');
        setFormStartDate(targetDateStr); setFormEndDate(targetDateStr);
        setFormSpecificDates([]);
        setFormHasTime(false); setFormTime('09:00');
        setFormIsEssential(false); setFormIsLocked(false); setFormTags([]);
        setIsModalOpen(true);
      };

      const openEventModalFromDate = (targetDateStr) => {
        setEditingEvent(null);
        setEditingHoliday(null);
        setEventTitle('');
        setEventDate(targetDateStr);
        setIsEventModalOpen(true);
      };

      const openModalForCreate = () => {
        openModalForCreateFromDate(new Date().toISOString().split('T')[0]);
      };

      const openModalForEdit = (todo) => {
        setEditingTodo(todo);
        setFormTitle(todo.title); setFormDetail(todo.detail);
        setFormHasDate(todo.hasDate !== false);
        setFormDateMode(todo.dateMode || 'range');
        setFormStartDate(todo.startDate || new Date().toISOString().split('T')[0]);
        setFormEndDate(todo.endDate || new Date().toISOString().split('T')[0]);
        setFormSpecificDates(todo.specificDates || []);
        setFormHasTime(!!todo.hasTime); setFormTime(todo.time || '09:00');
        setFormIsEssential(!!todo.isEssential); setFormIsLocked(!!todo.isLocked);
        setFormTags(todo.tags || []);
        setIsModalOpen(true);
      };

      const closeModal = () => { setIsModalOpen(false); setEditingTodo(null); };

      const handleAddTag = () => {
        if (newTagInput.trim() && !tags.includes(newTagInput.trim())) {
          const nextTags = [...tags, newTagInput.trim()];
          setTags(nextTags);
          saveUserDataToFirebase({ tags: nextTags });
          setNewTagInput('');
        }
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        const nextLists = [...lists, newList];
        setLists(nextLists); setSelectedListId(newList.id);
        saveUserDataToFirebase({ lists: nextLists, selectedListId: newList.id });
        setNewListName(''); setIsNewListModalOpen(false);
      };

      const handleSaveLocation = (code) => { setLocationCode(code); saveUserDataToFirebase({ locationCode: code }); };
      const handleSaveTheme = (th) => { setTheme(th); saveUserDataToFirebase({ theme: th }); };
      const handleSavePayday = (pd, adj) => { setPayday(pd); setPaydayAdjustment(adj); saveUserDataToFirebase({ payday: pd, paydayAdjustment: adj }); };
      const handleSaveNoticeDays = (days) => { setEssentialNoticeDays(days); saveUserDataToFirebase({ essentialNoticeDays: days }); };

      const handlePickerDateClick = (dateStr) => {
        if (formDateMode === 'range') {
          if (formStartDate === dateStr && formEndDate === dateStr) {
            setFormStartDate(''); setFormEndDate('');
          } else if (formStartDate === dateStr && !formEndDate) {
            setFormStartDate('');
          } else if (formEndDate === dateStr) {
            setFormEndDate('');
          } else if (!formStartDate) {
            setFormStartDate(dateStr);
          } else if (!formEndDate) {
            if (dateStr < formStartDate) {
              setFormEndDate(formStartDate);
              setFormStartDate(dateStr);
            } else {
              setFormEndDate(dateStr);
            }
          } else {
            setFormStartDate(dateStr);
            setFormEndDate('');
          }
        } else {
          if (formSpecificDates.includes(dateStr)) {
            setFormSpecificDates(formSpecificDates.filter(d => d !== dateStr));
          } else {
            setFormSpecificDates([...formSpecificDates, dateStr].sort());
          }
        }
      };

      const todayObj = new Date();
      const todayStr = todayObj.toISOString().split('T')[0];
      const currentYear = todayObj.getFullYear();
      const currentMonth = todayObj.getMonth() + 1;
      const calculatedPaydayStr = getAdjustedPaydayDateStr(currentYear, currentMonth, payday, paydayAdjustment);
      const isTodayPayday = calculatedPaydayStr === todayStr;

      const currentListTodos = todos.filter(t => t.listId === selectedListId);

      const noticeTargetDate = new Date();
      noticeTargetDate.setDate(noticeTargetDate.getDate() + parseInt(essentialNoticeDays, 10));
      const noticeTargetStr = noticeTargetDate.toISOString().split('T')[0];

      const upcomingEssentialTodos = currentListTodos.filter(t => {
        if (!t.isEssential || t.completed || !t.hasDate) return false;
        const targetDate = t.dateMode === 'specific' ? (t.specificDates && t.specificDates[0]) : t.startDate;
        return targetDate && targetDate >= todayStr && targetDate <= noticeTargetStr;
      });

      const filteredTodos = currentListTodos.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.detail.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = selectedTagFilter === 'すべて' || (t.tags && t.tags.includes(selectedTagFilter));
        let matchesDate = true;
        if (selectedDateFilter === 'today') {
          matchesDate = isTodoActiveOnDate(t, todayStr);
        } else if (selectedDateFilter === 'this_week') {
          const weekLaterObj = new Date(); weekLaterObj.setDate(weekLaterObj.getDate() + 7);
          const weekLaterStr = weekLaterObj.toISOString().split('T')[0];
          matchesDate = isTodoActiveOnDate(t, todayStr) || isTodoActiveOnDate(t, weekLaterStr);
        } else if (selectedDateFilter === 'no_date') {
          matchesDate = t.hasDate === false;
        }
        return matchesSearch && matchesTag && matchesDate;
      }).sort((a, b) => {
        if (sortBy === 'essential') return (b.isEssential ? 1 : 0) - (a.isEssential ? 1 : 0);
        else if (sortBy === 'date') {
          if (!a.hasDate) return 1; if (!b.hasDate) return -1;
          return (a.startDate || '').localeCompare(b.startDate || '');
        } else return b.id.localeCompare(a.id);
      });

      const todayTodos = currentListTodos.filter(t => isTodoActiveOnDate(t, todayStr));
      const todayMemos = memos.filter(m => !m.date || m.date === todayStr);
      const todayEvents = events.filter(e => e.date === todayStr);
      const todayHolidays = holidays.filter(h => h.date === todayStr);
      const todayWorkHours = workHours[todayStr];

      const dayOfWeekStr = ['日', '月', '火', '水', '木', '金', '土'][todayObj.getDay()];
      const formattedToday = `${todayObj.getMonth() + 1}月${todayObj.getDate()}日 (${dayOfWeekStr})`;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
      
      const calendarDays = [];
      for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(null);
      for (let i = 1; i <= lastDateOfMonth; i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        calendarDays.push({ day: i, dateStr });
      }
      while (calendarDays.length < 42) {
        calendarDays.push(null);
      }

      const calPaydayStr = getAdjustedPaydayDateStr(year, month + 1, payday, paydayAdjustment);

      const themeStyles = {
        headerBg: 'bg-white/90 border-slate-200/80 text-slate-900 backdrop-blur-md',
        primaryBtn: 'bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-sm hover-scale',
        activeTabBg: 'bg-slate-900 text-white font-bold rounded-xl shadow-sm',
        cardBg: 'bg-white border border-slate-200/80 shadow-xs rounded-2xl',
        accentText: 'text-slate-900 font-extrabold',
        floatingCal: 'bg-slate-900 hover:bg-slate-800 text-white shadow-xl rounded-2xl hover-scale',
        floatingSet: 'bg-white hover:bg-slate-50 text-slate-700 border shadow-md rounded-2xl hover-scale',
        todayCell: 'bg-slate-100 dark:bg-slate-800 border-2 border-slate-900 dark:border-slate-100',
        fontStyle: 'font-sans'
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm text-slate-100 animate-modal">
              <div className="text-center mb-6">
                <div className="bg-blue-600 text-white p-3 rounded-2xl w-12 h-12 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
                  <i data-lucide="check-square" className="w-6 h-6"></i>
                </div>
                <h1 className="text-xl font-extrabold tracking-tight">TaskFlow (Cloud Sync)</h1>
                <p className="text-xs text-slate-400 mt-1">{authMode === 'login' ? 'ログイン' : '新規アカウント登録'}</p>
              </div>

              {authError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs font-medium leading-relaxed">{authError}</div>}

              <form onSubmit={handleAuthSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-[10px] text-slate-400 mb-1 font-bold">ユーザーID</label>
                  <input type="text" value={customIdInput} onChange={(e) => setCustomIdInput(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm outline-none focus:border-blue-500 text-slate-100 font-bold" placeholder="例: user123" required />
                </div>
                <div>
                  <label className="block text-[10px] text-slate-400 mb-1 font-bold">パスワード (6文字以上)</label>
                  <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm outline-none focus:border-blue-500 text-slate-100" placeholder="••••••••" required />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30 transition hover-scale">{authMode === 'login' ? 'ログイン' : '登録して開始'}</button>
              </form>
              <div className="mt-6 text-center border-t border-slate-800 pt-4">
                <button type="button" onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }} className="text-blue-400 hover:underline text-xs font-semibold">{authMode === 'login' ? 'アカウント作成はこちら' : 'ログイン画面へ戻る'}</button>
              </div>
            </div>
          </div>
        );
      }

      return (

            <button onClick={() => setActiveTab('todos')} className={`px-3.5 py-1.5 font-bold text-xs whitespace-nowrap transition hover-scale ${activeTab === 'todos' ? themeStyles.activeTabBg : 'opacity-70 hover:opacity-100 hover:bg-black/5 rounded-xl'}`}>📝 ToDo</button>
            <button onClick={() => setActiveTab('memos')} className={`px-3.5 py-1.5 font-bold text-xs whitespace-nowrap transition hover-scale ${activeTab === 'memos' ? themeStyles.activeTabBg : 'opacity-70 hover:opacity-100 hover:bg-black/5 rounded-xl'}`}>📌 メモ</button>
          </div>

          <main className="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">

                {upcomingEssentialTodos.length > 0 && (
                  <div className="bg-gradient-to-r from-red-500/15 via-rose-500/10 to-amber-500/10 border-2 border-red-500/40 rounded-3xl p-4 shadow-md space-y-2">
                    <div className="flex items-center gap-1.5 text-red-600 font-extrabold text-xs">
                      <span className="animate-bounce">⚠️</span>
                      <span>まもなく期限の必須タスク ({essentialNoticeDays}日以内: {upcomingEssentialTodos.length}件)</span>
                    </div>
                    <div className="space-y-1.5">
                      {upcomingEssentialTodos.map(todo => (
                        <div key={todo.id} className="bg-white/90 p-2.5 rounded-2xl border border-red-200 flex items-center justify-between shadow-2xs">
                          <span className="font-bold text-xs truncate flex-1 mr-2">{todo.title}</span>
                          <span className="bg-red-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-lg shrink-0">📅 {todo.startDate}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className={`p-4 ${themeStyles.cardBg} space-y-3`}>
                  <div className="flex items-center justify-between">
                    <div>
                      <span className={`text-[10px] uppercase tracking-widest ${themeStyles.accentText}`}>TODAY'S SCHEDULE</span>
                      <div className="text-base font-black mt-0.5">{formattedToday}</div>
                    </div>
                    <div className="flex items-center gap-2.5 bg-black/5 px-3 py-1.5 rounded-2xl border border-black/5">
                      <span className="text-xl">{weather.icon}</span>
                      <div className="text-right">
                        <div className="text-[11px] font-extrabold">{weather.text}</div>
                        <div className="text-[9px] opacity-60 font-medium">{PREFECTURES.find(p => p.code === locationCode)?.name || '選択地域'}</div>
                      </div>
                    </div>
                  </div>

                  {todayWorkHours ? (
                    <div className="bg-blue-500/10 border border-blue-500/30 rounded-2xl p-2.5 flex items-center justify-between text-blue-700 font-bold text-xs">
                      <span>💼 本日の仕事時間: {todayWorkHours.start} 〜 {todayWorkHours.end}</span>
                    </div>
                  ) : (
                    <div className="bg-slate-100 border border-slate-200 rounded-2xl p-2.5 flex items-center justify-between text-slate-500 font-bold text-xs">
                      <span>💼 本日の仕事時間: 未設定</span>
                    </div>
                  )}

                  {(todayEvents.length > 0 || todayHolidays.length > 0 || isTodayPayday) && (
                    <div className="pt-2 border-t border-black/5 flex flex-wrap gap-1.5">
                      {isTodayPayday && <span className="bg-emerald-500/20 text-emerald-700 font-extrabold text-[10px] px-2.5 py-1 rounded-xl">💰 給料日</span>}
                      {todayEvents.map(ev => <span key={ev.id} className="bg-purple-500/20 text-purple-700 font-bold text-[10px] px-2.5 py-1 rounded-xl">{ev.icon || '🎉'} {ev.title}</span>)}
                      {todayHolidays.map(hol => <span key={hol.id} className="bg-amber-500/20 text-amber-700 font-bold text-[10px] px-2.5 py-1 rounded-xl">🏖️ {hol.memberName} のお休み</span>)}
                    </div>
                  )}
                </div>

                <div className="space-y-2.5">
                  <span className="font-extrabold opacity-80 text-xs px-1">本日のタスク ({todayTodos.length}件)</span>
                  {todayTodos.length === 0 ? (
                    <div className={`p-8 text-center opacity-50 text-xs ${themeStyles.cardBg}`}>本日の予定はありません。</div>
                  ) : (
                    todayTodos.map(todo => (
                      <div key={todo.id} className={`p-3.5 transition border ${todo.isEssential ? 'bg-gradient-to-r from-red-500/10 via-rose-500/5 to-transparent border-red-500 border-2 shadow-md' : `${themeStyles.cardBg}`} ${todo.completed ? 'opacity-40 line-through' : ''}`}>
                        <div className="flex items-start justify-between gap-2.5">
                          <div className="flex items-start gap-3 flex-1 min-w-0">
                            <input type="checkbox" checked={todo.completed} onChange={() => toggleComplete(todo.id)} className="mt-0.5 w-4 h-4 text-indigo-600 rounded cursor-pointer shrink-0" />
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2">
                                <span className={`font-bold truncate text-xs ${todo.completed ? 'line-through opacity-50' : ''}`}>{todo.title}</span>
                                {todo.isEssential && <span className="bg-red-600 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-full shadow-xs animate-pulse shrink-0">必須</span>}
                                {todo.isLocked && <span className="opacity-50 shrink-0">🔒</span>}
                              </div>
                              {todo.detail && <p className="text-[11px] opacity-70 truncate mt-1">{todo.detail}</p>}
                            </div>
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            <button onClick={() => toggleLockTodo(todo.id)} className="opacity-60 hover:opacity-100 p-1 rounded hover-scale">{todo.isLocked ? "🔒" : "🔓"}</button>
                            <button onClick={() => openModalForEdit(todo)} className="opacity-60 hover:opacity-100 p-1.5 hover-scale"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                            <button onClick={() => deleteTodo(todo.id)} className="opacity-60 hover:text-rose-500 p-1.5 hover-scale"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="bg-amber-500/10 border border-amber-500/20 rounded-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-extrabold text-amber-800 text-xs flex items-center gap-1.5">📌 本日のメモ</span>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="例: 牛乳を買う..." value={newQuickMemo} onChange={(e) => setNewQuickMemo(e.target.value)} className="flex-1 px-3.5 py-2.5 bg-white border border-amber-500/30 rounded-2xl text-sm outline-none" onKeyDown={(e) => { if (e.key === 'Enter') handleAddMemo(todayStr); }} />
                    <button onClick={() => handleAddMemo(todayStr)} className="bg-amber-600 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-sm shrink-0 hover-scale">追加</button>
                  </div>
                  <div className="space-y-2 pt-1">
                    {todayMemos.map(memo => (
                      <div key={memo.id} className="bg-white p-2.5 rounded-2xl border border-amber-500/20 flex items-center justify-between shadow-2xs">
                        <div className="flex items-center gap-2.5 flex-1 min-w-0">
                          <input type="checkbox" checked={memo.completed} onChange={() => toggleMemoComplete(memo.id)} className="w-4 h-4 text-amber-600 rounded cursor-pointer shrink-0" />
                          <span className={`text-xs font-medium truncate ${memo.completed ? 'line-through opacity-40' : ''}`}>{memo.text}</span>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0 ml-2">
                          <button onClick={() => promoteMemoToTodo(memo)} className="bg-indigo-500/10 text-indigo-600 px-2.5 py-1 rounded-xl text-[10px] font-bold">予定化</button>
                          <button onClick={() => deleteMemo(memo.id)} className="opacity-40 hover:text-rose-500 p-1"><i data-lucide="x" className="w-3.5 h-3.5"></i></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'todos' && (
              <div className="space-y-3.5 animate-modal">
                <div className={`p-3.5 space-y-2.5 ${themeStyles.cardBg}`}>
                  <input type="text" placeholder="文字検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full px-3.5 py-2.5 bg-black/5 rounded-2xl text-sm outline-none" />
                  <div className="flex items-center justify-between gap-2 pt-1">
                    <select value={selectedDateFilter} onChange={(e) => setSelectedDateFilter(e.target.value)} className="bg-black/5 px-2.5 py-1.5 rounded-xl text-[11px] font-bold outline-none">
                      <option value="すべて">📅 期間: すべて</option>
                      <option value="today">📅 期間: 本日</option>
                      <option value="this_week">📅 期間: 今週以内</option>
                      <option value="no_date">📅 期間: 期限なし</option>
                    </select>
                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-black/5 px-2.5 py-1.5 rounded-xl text-[11px] font-bold outline-none">
                      <option value="created">⇅ 新しい順</option>
                      <option value="essential">⇅ 必須順</option>
                      <option value="date">⇅ 期限が近い順</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-2.5">
                  {filteredTodos.map(todo => (
                    <div key={todo.id} className={`p-3.5 border rounded-2xl bg-white flex items-center justify-between ${todo.completed ? 'opacity-40 line-through' : ''}`}>
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <input type="checkbox" checked={todo.completed} onChange={() => toggleComplete(todo.id)} className="w-4 h-4 text-indigo-600 rounded cursor-pointer shrink-0" />
                        <span className="font-bold text-xs truncate">{todo.title}</span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => toggleLockTodo(todo.id)} className="opacity-60 hover:opacity-100 p-1">{todo.isLocked ? "🔒" : "🔓"}</button>
                        <button onClick={() => openModalForEdit(todo)} className="opacity-60 hover:opacity-100 p-1.5"><i data-lucide="edit-3" className="w-3.5 h-3.5"></i></button>
                        <button onClick={() => deleteTodo(todo.id)} className="opacity-60 hover:text-rose-500 p-1.5"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>

                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'memos' && (
              <div className="space-y-4 animate-modal">
                <div className="p-4 space-y-3 bg-white border rounded-2xl">

                  <button onClick={() => setSettingsTab('alert')} className={`px-2.5 py-1.5 rounded-xl ${settingsTab === 'alert' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`}>🔔 給料・通知</button>
                  <button onClick={() => setSettingsTab('work')} className={`px-2.5 py-1.5 rounded-xl ${settingsTab === 'work' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`}>💼 勤務テンプレ</button>
                  <button onClick={() => setSettingsTab('app')} className={`px-2.5 py-1.5 rounded-xl ${settingsTab === 'app' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`}>🎨 テーマ</button>
                  <button onClick={() => setSettingsTab('feedback')} className={`px-2.5 py-1.5 rounded-xl ${settingsTab === 'feedback' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`}>💬 要望</button>
                </div>

                {settingsTab === 'account' && (
                  <form onSubmit={handleUpdatePassword} className="space-y-2.5 pt-1">
                    {accountMsg && <div className="p-2 bg-indigo-500/10 text-indigo-600 font-bold text-[10px] rounded-xl text-center">{accountMsg}</div>}
                    <div>
                      <label className="block text-[10px] opacity-60">ログイン中ユーザーID</label>
                      <input type="text" value={currentUser?.email?.replace('@app.local', '') || ''} disabled className="w-full px-3 py-2 bg-black/10 rounded-xl text-xs font-bold" />
                    </div>
                    <div>
                      <label className="block text-[10px] opacity-60">新しいパスワード (6文字以上)</label>
                      <input type="password" value={newPasswordInput} onChange={(e) => setNewPasswordInput(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold" required />
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">パスワード変更</button>
                  </form>
                )}

                {settingsTab === 'alert' && (
                  <div className="space-y-3 pt-1">
                    <div className="space-y-1">
                      <label className="block text-[10px] opacity-60 font-bold">💰 給料日設定</label>
                      <div className="flex gap-2">
                        <select value={payday} onChange={(e) => handleSavePayday(e.target.value, paydayAdjustment)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold">
                          {Array.from({ length: 31 }, (_, i) => i + 1).map(d => <option key={d} value={d}>{d}日</option>)}
                          <option value="last">月末</option>
                        </select>
                        <select value={paydayAdjustment} onChange={(e) => handleSavePayday(payday, e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold">
                          <option value="prev">土日祝なら前倒し</option>
                          <option value="next">土日祝なら後ろ倒し</option>
                          <option value="none">調整なし</option>
                        </select>
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="block text-[10px] opacity-60 font-bold">🔔 必須タスクの事前通知</label>
                      <select value={essentialNoticeDays} onChange={(e) => handleSaveNoticeDays(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-bold">
                        <option value="1">1日前</option>
                        <option value="3">3日前</option>
                        <option value="7">7日前 (1週間)</option>
                        <option value="14">14日前</option>
                      </select>
                    </div>
                  </div>
                )}

                {settingsTab === 'work' && (
                  <div className="space-y-3 pt-1">
                    <label className="block text-[10px] opacity-60 font-bold">💼 デフォルトの仕事・活動時間 (テンプレ)</label>
                    <div className="flex items-center gap-2">
                      <input type="time" value={defaultWorkStart} onChange={(e) => handleSaveDefaultWorkTemplate(e.target.value, defaultWorkEnd)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold text-center" />
                      <span className="font-bold text-slate-500">〜</span>
                      <input type="time" value={defaultWorkEnd} onChange={(e) => handleSaveDefaultWorkTemplate(defaultWorkStart, e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold text-center" />
                    </div>
                    <p className="text-[10px] opacity-60 leading-relaxed">ここでの時間はテンプレとしての保持用です。個別に日付を開いて「保存」を押すまではカレンダー等には自動登録されません。</p>
                  </div>
                )}

                {settingsTab === 'app' && (
                  <div className="space-y-3 pt-1">
                    <label className="block text-[10px] opacity-60">デザインテーマ</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      <button onClick={() => handleSaveTheme('simple')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'simple' ? 'bg-slate-900 text-white' : 'bg-black/5'}`}>⚪ シンプル</button>
                      <button onClick={() => handleSaveTheme('animal')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'animal' ? 'bg-rose-400 text-white' : 'bg-pink-50 text-rose-800'}`}>🐾 アニマル</button>
                      <button onClick={() => handleSaveTheme('business')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'business' ? 'bg-blue-600 text-white' : 'bg-black/5'}`}>💼 ビジネス</button>
                    </div>
                    <button onClick={() => setIsTrashOpen(true)} className="w-full bg-black/5 py-2 rounded-xl text-xs font-bold">ゴミ箱 ({trash.length}件)</button>
                  </div>
                )}

                {settingsTab === 'feedback' && (
                  <form onSubmit={handleSendFeedback} className="space-y-2 pt-1">
                    {feedbackMsg && <div className="p-2 bg-emerald-500/10 text-emerald-600 font-bold text-[10px] rounded-xl text-center">{feedbackMsg}</div>}
                    <textarea value={feedbackInput} onChange={(e) => setFeedbackInput(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs h-20" placeholder="ご意見やリクエストを入力..." required />
                    <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">送信</button>
                  </form>
                )}

                <div className="flex justify-end pt-2 border-t">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* ゴミ箱モーダル */}
          {isTrashOpen && (
            <div className="fixed inset-0 bg-slate-950/70 flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border space-y-3.5">
                <div className="flex justify-between border-b pb-2">
                  <h2 className="text-xs font-bold">🗑️ ゴミ箱</h2>
                  <button onClick={() => setIsTrashOpen(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {trash.length === 0 ? <div className="p-6 text-center opacity-40 text-xs">ゴミ箱は空です</div> : trash.map(item => (
                    <div key={item.id} className="bg-black/5 p-2.5 rounded-xl flex justify-between items-center">
                      <span className="text-xs font-bold truncate flex-1">{item.title}</span>
                      <div className="flex gap-1 shrink-0 ml-2">
                        <button onClick={() => restoreFromTrash(item.id)} className="bg-indigo-500/20 text-indigo-600 px-2 py-1 rounded text-[10px] font-bold">復元</button>
                        <button onClick={() => permanentlyDeleteFromTrash(item.id)} className="text-rose-500 px-1"><i data-lucide="x" className="w-4 h-4"></i></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 新規リストモーダル */}
          {isNewListModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border space-y-3">
                <h2 className="text-xs font-bold">新規リスト作成</h2>
                <form onSubmit={handleCreateList} className="space-y-3">
                  <input type="text" value={newListName} onChange={(e) => setNewListName(e.target.value)} className="w-full px-3.5 py-2.5 border rounded-2xl text-sm font-bold" placeholder="リスト名" required />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewListModalOpen(false)} className="px-4 py-2 border rounded-xl text-xs font-bold">キャンセル</button>
                    <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-bold ${themeStyles.primaryBtn}`}>作成</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
