<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ToDo & カレンダー App</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f1f5f9;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PREFECTURES = [
      { name: '愛知県 (豊橋/名古屋)', code: '230000' },
      { name: '東京都', code: '130000' },
      { name: '北海道 (札幌)', code: '016000' },
      { name: '宮城県 (仙台)', code: '040000' },
      { name: '大阪府', code: '270000' },
      { name: '広島県', code: '340000' },
      { name: '福岡県', code: '400000' },
      { name: '沖縄県 (那覇)', code: '471000' }
    ];

    function App() {
      // 認証関連
      const [authMode, setAuthMode] = useState('login'); 
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');

      // メインタブ ('today' | 'todos' | 'memos')
      const [activeTab, setActiveTab] = useState('today');

      // データ管理
      const [lists, setLists] = useState([]);
      const [selectedListId, setSelectedListId] = useState('');
      const [todos, setTodos] = useState([]);
      const [trash, setTrash] = useState([]); // ゴミ箱 [{ ...todo, deletedAt }]
      const [memos, setMemos] = useState([]); 
      const [tags, setTags] = useState([]);

      // 地域設定
      const [locationCode, setLocationCode] = useState('230000');

      // 検索・フィルター・ソート
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTagFilter, setSelectedTagFilter] = useState('すべて');
      const [selectedDateFilter, setSelectedDateFilter] = useState('すべて'); // 'すべて' | 'today' | 'this_week' | 'no_date'
      const [sortBy, setSortBy] = useState('created'); // 'created' | 'essential' | 'date'

      // モーダル管理
      const [isCalendarOpen, setIsCalendarOpen] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isNewListModalOpen, setIsNewListModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTrashOpen, setIsTrashOpen] = useState(false); // ゴミ箱モーダル

      // 一括操作用（選択されたTodo ID）
      const [selectedTodoIds, setSelectedTodoIds] = useState([]);

      // 入力用 State
      const [newQuickMemo, setNewQuickMemo] = useState('');

      // Form State (Todo)
      const [editingTodo, setEditingTodo] = useState(null);
      const [formTitle, setFormTitle] = useState('');
      const [formDetail, setFormDetail] = useState('');
      const [formHasDate, setFormHasDate] = useState(true);
      const [formStartDate, setFormStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [formEndDate, setFormEndDate] = useState(new Date().toISOString().split('T')[0]);
      const [formHasTime, setFormHasTime] = useState(false);
      const [formTime, setFormTime] = useState('09:00');
      const [formIsEssential, setFormIsEssential] = useState(false); 
      const [formIsLocked, setFormIsLocked] = useState(false); 
      const [formTags, setFormTags] = useState([]);
      const [newTagInput, setNewTagInput] = useState('');
      const [newListName, setNewListName] = useState('');

      // カレンダー用
      const [currentDate, setCurrentDate] = useState(new Date());

      // 天気状態
      const [weather, setWeather] = useState({ text: '読み込み中...', icon: '🌤️' });

      // 初回読込
      useEffect(() => {
        const sessionUser = localStorage.getItem('app_active_user');
        if (sessionUser) {
          loadUserData(sessionUser);
        }
      }, []);

      // Lucide Icons
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // 天気取得 (気象庁API)
      useEffect(() => {
        if (!isLoggedIn) return;
        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${locationCode}.json`)
          .then(res => res.json())
          .then(data => {
            const todayWeather = data[0].timeSeries[0].areas[0].weathers[0];
            let icon = '☀️';
            if (todayWeather.includes('雨')) icon = '🌧️';
            else if (todayWeather.includes('くもり') || todayWeather.includes('曇')) icon = '☁️';
            else if (todayWeather.includes('雪')) icon = '❄️';

            setWeather({ text: todayWeather.split('　')[0], icon });
          })
          .catch(() => {
            setWeather({ text: '晴れ時々くもり', icon: '🌤️' });
          });
      }, [locationCode, isLoggedIn]);

      const loadUserData = (id) => {
        const rawData = localStorage.getItem(`app_data_${id}`);
        if (rawData) {
          const data = JSON.parse(rawData);
          setLists(data.lists || []);
          setSelectedListId(data.selectedListId || (data.lists && data.lists[0]?.id) || '');
          setTodos(data.todos || []);
          
          // ゴミ箱データの24時間自動クリーンアップ
          const now = Date.now();
          const validTrash = (data.trash || []).filter(item => (now - item.deletedAt) < 24 * 60 * 60 * 1000);
          setTrash(validTrash);

          setMemos(data.memos || []);
          setTags(data.tags || []);
          setLocationCode(data.locationCode || '230000');
        } else {
          setLists([]);
          setSelectedListId('');
          setTodos([]);
          setTrash([]);
          setMemos([]);
          setTags([]);
          setLocationCode('230000');
        }
        setUserId(id);
        setIsLoggedIn(true);
        localStorage.setItem('app_active_user', id);
      };

      const saveUserData = (updatedTodos, updatedLists, updatedTags, updatedLocation, updatedSelectedListId, updatedMemos, updatedTrash) => {
        if (!userId) return;
        const dataToSave = {
          lists: updatedLists !== undefined ? updatedLists : lists,
          selectedListId: updatedSelectedListId !== undefined ? updatedSelectedListId : selectedListId,
          todos: updatedTodos !== undefined ? updatedTodos : todos,
          trash: updatedTrash !== undefined ? updatedTrash : trash,
          memos: updatedMemos !== undefined ? updatedMemos : memos,
          tags: updatedTags !== undefined ? updatedTags : tags,
          locationCode: updatedLocation !== undefined ? updatedLocation : locationCode
        };
        localStorage.setItem(`app_data_${userId}`, JSON.stringify(dataToSave));
      };

      const handleAuth = (e) => {
        e.preventDefault();
        setAuthError('');
        const storedUsers = JSON.parse(localStorage.getItem('app_users_db') || '{}');

        if (authMode === 'signup') {
          if (storedUsers[userId]) {
            setAuthError('このIDは既に登録されています');
            return;
          }
          storedUsers[userId] = password;
          localStorage.setItem('app_users_db', JSON.stringify(storedUsers));
          loadUserData(userId);
        } else {
          if (!storedUsers[userId] || storedUsers[userId] !== password) {
            setAuthError('IDまたはパスワードが正しくありません');
            return;
          }
          loadUserData(userId);
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setUserId('');
        setPassword('');
        localStorage.removeItem('app_active_user');
      };

      // ToDo追加/編集
      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        let nextTodos;
        if (editingTodo) {
          nextTodos = todos.map(t => t.id === editingTodo.id ? {
            ...t,
            title: formTitle,
            detail: formDetail,
            hasDate: formHasDate,
            startDate: formHasDate ? formStartDate : '',
            endDate: formHasDate ? formEndDate : '',
            hasTime: formHasTime,
            time: formHasTime ? formTime : '',
            isEssential: formIsEssential,
            isLocked: formIsLocked,
            tags: formTags,
          } : t);
        } else {
          const newTodo = {
            id: Date.now().toString(),
            listId: selectedListId,
            title: formTitle,
            detail: formDetail,
            hasDate: formHasDate,
            startDate: formHasDate ? formStartDate : '',
            endDate: formHasDate ? formEndDate : '',
            hasTime: formHasTime,
            time: formHasTime ? formTime : '',
            isEssential: formIsEssential,
            isLocked: formIsLocked,
            tags: formTags,
            completed: false,
          };
          nextTodos = [...todos, newTodo];
        }
        setTodos(nextTodos);
        saveUserData(nextTodos);
        closeModal();
      };

      // ゴミ箱へ移動（論理削除）
      const deleteTodo = (id) => {
        const target = todos.find(t => t.id === id);
        if (!target) return;

        if (target.isLocked) {
          alert('🔒 ロックされているため削除できません。編集画面からロックを解除してください。');
          return;
        }

        const nextTodos = todos.filter(t => t.id !== id);
        const nextTrash = [{ ...target, deletedAt: Date.now() }, ...trash];
        
        setTodos(nextTodos);
        setTrash(nextTrash);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
        if (editingTodo && editingTodo.id === id) closeModal();
      };

      // ゴミ箱からの復元
      const restoreFromTrash = (id) => {
        const target = trash.find(t => t.id === id);
        if (!target) return;

        const { deletedAt, ...todoData } = target;
        const nextTrash = trash.filter(t => t.id !== id);
        const nextTodos = [...todos, todoData];

        setTodos(nextTodos);
        setTrash(nextTrash);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      // ゴミ箱からの完全削除
      const permanentlyDeleteFromTrash = (id) => {
        const nextTrash = trash.filter(t => t.id !== id);
        setTrash(nextTrash);
        saveUserData(undefined, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      // 選択したチェックボックス項目を一括削除（ロック済みは除外）
      const handleBulkDelete = () => {
        if (selectedTodoIds.length === 0) return;

        const targets = todos.filter(t => selectedTodoIds.includes(t.id));
        const lockedTargets = targets.filter(t => t.isLocked);

        if (lockedTargets.length > 0) {
          alert(`選択した項目のうち ${lockedTargets.length} 件は🔒ロックされているため削除対象から除外されます。`);
        }

        const deletableTargets = targets.filter(t => !t.isLocked);
        if (deletableTargets.length === 0) return;

        const deletableIds = deletableTargets.map(t => t.id);
        const nextTodos = todos.filter(t => !deletableIds.includes(t.id));
        const newTrashItems = deletableTargets.map(t => ({ ...t, deletedAt: Date.now() }));
        const nextTrash = [...newTrashItems, ...trash];

        setTodos(nextTodos);
        setTrash(nextTrash);
        setSelectedTodoIds([]);
        saveUserData(nextTodos, undefined, undefined, undefined, undefined, undefined, nextTrash);
      };

      const toggleTodoSelect = (id) => {
        if (selectedTodoIds.includes(id)) {
          setSelectedTodoIds(selectedTodoIds.filter(i => i !== id));
        } else {
          setSelectedTodoIds([...selectedTodoIds, id]);
        }
      };

      const toggleLockTodo = (id) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, isLocked: !t.isLocked } : t);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      // 覚え書きメモ機能
      const handleAddMemo = (targetDate = null) => {
        if (!newQuickMemo.trim()) return;
        const newMemoItem = {
          id: Date.now().toString(),
          text: newQuickMemo.trim(),
          date: targetDate || '',
          completed: false
        };
        const nextMemos = [newMemoItem, ...memos];
        setMemos(nextMemos);
        saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
        setNewQuickMemo('');
      };

      const toggleMemoComplete = (id) => {
        const nextMemos = memos.map(m => m.id === id ? { ...m, completed: !m.completed } : m);
        setMemos(nextMemos);
        saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
      };

      const deleteMemo = (id) => {
        const nextMemos = memos.filter(m => m.id !== id);
        setMemos(nextMemos);
        saveUserData(undefined, undefined, undefined, undefined, undefined, nextMemos);
      };

      const promoteMemoToTodo = (memo) => {
        if (!selectedListId && lists.length === 0) {
          alert('最初にリストを作成してください。');
          setIsNewListModalOpen(true);
          return;
        }
        deleteMemo(memo.id);
        
        setEditingTodo(null);
        setFormTitle(memo.text);
        setFormDetail('');
        setFormHasDate(true);
        const todayStr = new Date().toISOString().split('T')[0];
        setFormStartDate(memo.date || todayStr);
        setFormEndDate(memo.date || todayStr);
        setFormHasTime(false);
        setFormTime('09:00');
        setFormIsEssential(false);
        setFormIsLocked(false);
        setFormTags([]);
        setIsModalOpen(true);
      };

      const handleRescheduleTodo = (id, newDate) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, hasDate: true, startDate: newDate, endDate: newDate } : t);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      const openModalForCreateFromDate = (targetDateStr) => {
        if (!selectedListId && lists.length === 0) {
          alert('最初にリストを作成してください。');
          setIsNewListModalOpen(true);
          return;
        }
        setEditingTodo(null);
        setFormTitle('');
        setFormDetail('');
        setFormHasDate(true);
        setFormStartDate(targetDateStr);
        setFormEndDate(targetDateStr);
        setFormHasTime(false);
        setFormTime('09:00');
        setFormIsEssential(false);
        setFormIsLocked(false);
        setFormTags([]);
        setIsModalOpen(true);
      };

      const openModalForCreate = () => {
        openModalForCreateFromDate(new Date().toISOString().split('T')[0]);
      };

      const openModalForEdit = (todo) => {
        setEditingTodo(todo);
        setFormTitle(todo.title);
        setFormDetail(todo.detail);
        setFormHasDate(todo.hasDate !== false);
        setFormStartDate(todo.startDate || new Date().toISOString().split('T')[0]);
        setFormEndDate(todo.endDate || new Date().toISOString().split('T')[0]);
        setFormHasTime(!!todo.hasTime);
        setFormTime(todo.time || '09:00');
        setFormIsEssential(!!todo.isEssential);
        setFormIsLocked(!!todo.isLocked);
        setFormTags(todo.tags || []);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingTodo(null);
      };

      const toggleComplete = (id) => {
        const nextTodos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        setTodos(nextTodos);
        saveUserData(nextTodos);
      };

      const handleAddTag = () => {
        if (newTagInput.trim() && !tags.includes(newTagInput.trim())) {
          const nextTags = [...tags, newTagInput.trim()];
          setTags(nextTags);
          saveUserData(undefined, undefined, nextTags);
          setNewTagInput('');
        }
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        const nextLists = [...lists, newList];
        setLists(nextLists);
        setSelectedListId(newList.id);
        saveUserData(undefined, nextLists, undefined, undefined, newList.id);
        setNewListName('');
        setIsNewListModalOpen(false);
      };

      const handleSaveLocation = (code) => {
        setLocationCode(code);
        saveUserData(undefined, undefined, undefined, code);
      };

      // 日付関連計算
      const todayObj = new Date();
      const todayStr = todayObj.toISOString().split('T')[0];

      // Smart フィルタリング & ソート
      const currentListTodos = todos.filter(t => t.listId === selectedListId);
      
      const filteredTodos = currentListTodos.filter(t => {
        // 1. 文字検索
        const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              t.detail.toLowerCase().includes(searchQuery.toLowerCase());
        // 2. タグ検索
        const matchesTag = selectedTagFilter === 'すべて' || (t.tags && t.tags.includes(selectedTagFilter));

        // 3. 期間検索
        let matchesDate = true;
        if (selectedDateFilter === 'today') {
          matchesDate = t.hasDate !== false && t.startDate <= todayStr && t.endDate >= todayStr;
        } else if (selectedDateFilter === 'this_week') {
          const weekLaterObj = new Date();
          weekLaterObj.setDate(weekLaterObj.getDate() + 7);
          const weekLaterStr = weekLaterObj.toISOString().split('T')[0];
          matchesDate = t.hasDate !== false && t.startDate <= weekLaterStr && t.endDate >= todayStr;
        } else if (selectedDateFilter === 'no_date') {
          matchesDate = t.hasDate === false;
        }

        return matchesSearch && matchesTag && matchesDate;
      }).sort((a, b) => {
        if (sortBy === 'essential') {
          return (b.isEssential ? 1 : 0) - (a.isEssential ? 1 : 0);
        } else if (sortBy === 'date') {
          if (!a.hasDate) return 1;
          if (!b.hasDate) return -1;
          return a.startDate.localeCompare(b.startDate);
        } else {
          return b.id.localeCompare(a.id); // 作成順 (Newest)
        }
      });

      const todayTodos = currentListTodos.filter(t => t.hasDate !== false && t.startDate <= todayStr && t.endDate >= todayStr);
      const todayMemos = memos.filter(m => !m.date || m.date === todayStr);
      const overdueTodos = currentListTodos.filter(t => t.hasDate !== false && t.endDate < todayStr && !t.completed);

      const dayOfWeekStr = ['日', '月', '火', '水', '木', '金', '土'][todayObj.getDay()];
      const formattedToday = `${todayObj.getMonth() + 1}月${todayObj.getDate()}日 (${dayOfWeekStr})`;

      // カレンダー
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();

      const calendarDays = [];
      for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(null);
      for (let i = 1; i <= lastDateOfMonth; i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        calendarDays.push({ day: i, dateStr });
      }

      // 未ログイン画面
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900/90 backdrop-blur-md p-4">
            <div className="bg-white p-7 rounded-2xl shadow-2xl w-full max-w-xs border border-slate-100">
              <div className="text-center mb-6">
                <div className="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-2.5 rounded-xl w-10 h-10 flex items-center justify-center mx-auto mb-2.5 shadow-lg shadow-indigo-200">
                  <i data-lucide="check-square" className="w-5 h-5"></i>
                </div>
                <h1 className="text-lg font-extrabold text-slate-800 tracking-tight">ToDo & Calendar</h1>
                <p className="text-[11px] text-slate-400 mt-1">
                  {authMode === 'login' ? 'アカウントにサインイン' : '新規アカウントを登録'}
                </p>
              </div>

              {authError && (
                <div className="mb-3 p-2 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-[11px] text-center font-medium">
                  {authError}
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-3">
                <input
                  type="text"
                  value={userId}
                  onChange={(e) => setUserId(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-base outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition"
                  placeholder="ユーザーID"
                  required
                />
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-base outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition"
                  placeholder="パスワード"
                  required
                />
                <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-2 rounded-lg text-xs font-bold hover:opacity-90 shadow-md shadow-indigo-100 transition">
                  {authMode === 'login' ? 'ログイン' : '登録して開始'}
                </button>
              </form>

              <div className="mt-5 text-center border-t border-slate-100 pt-3">
                <button
                  type="button"
                  onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }}
                  className="text-indigo-600 font-semibold hover:underline text-[11px]"
                >
                  {authMode === 'login' ? 'アカウント作成はこちら' : 'ログイン画面へ戻る'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100/70 text-xs flex flex-col font-sans">
          {/* ヘッダー */}
          <header className="bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-4 py-2.5 flex items-center justify-between sticky top-0 z-20 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2">
                <div className="bg-gradient-to-tr from-indigo-600 to-violet-600 text-white p-1.5 rounded-lg shadow-sm">
                  <i data-lucide="check-square" className="w-4 h-4"></i>
                </div>
                <span className="font-extrabold text-slate-800 text-sm tracking-tight hidden sm:inline">TaskFlow</span>
              </div>

              {/* リスト選択 */}
              <div className="flex items-center gap-1.5 bg-slate-100/80 px-2.5 py-1 rounded-lg border border-slate-200">
                <span className="text-[10px] text-slate-400 font-medium">リスト:</span>
                <select
                  value={selectedListId}
                  onChange={(e) => setSelectedListId(e.target.value)}
                  className="bg-transparent font-bold text-slate-700 outline-none text-xs cursor-pointer"
                >
                  {lists.length === 0 ? (
                    <option value="">(リストなし)</option>
                  ) : (
                    lists.map(l => <option key={l.id} value={l.id}>{l.name}</option>)

                    <button onClick={() => setCurrentDate(new Date())} className="px-2 py-1 border rounded-lg text-[10px] font-bold hover:bg-slate-50">今月</button>
                    <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="px-2 py-1 border rounded-lg text-[10px] font-bold hover:bg-slate-50">次月</button>
                    <button onClick={() => setIsCalendarOpen(false)} className="ml-1 text-slate-400 p-1">
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center font-bold text-slate-400 text-[10px] mb-1">
                  <span className="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {calendarDays.map((item, index) => {
                    if (!item) return <div key={`empty-${index}`} className="h-14 bg-slate-50/50 rounded-lg"></div>;
                    const dayTodos = currentListTodos.filter(t => t.hasDate !== false && t.startDate <= item.dateStr && t.endDate >= item.dateStr);
                    const dayMemoCount = memos.filter(m => m.date === item.dateStr).length;

                    return (
                      <div
                        key={item.dateStr}
                        onClick={() => openModalForCreateFromDate(item.dateStr)}
                        className="h-14 border border-slate-200/80 bg-white rounded-lg p-1 flex flex-col justify-between hover:border-indigo-400 transition cursor-pointer group"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-bold text-slate-700">{item.day}</span>
                          {dayMemoCount > 0 && <span className="text-[8px] bg-amber-100 text-amber-800 font-extrabold px-1 rounded">📌{dayMemoCount}</span>}
                        </div>

                        <div className="space-y-0.5 overflow-y-auto">
                          {dayTodos.map(todo => (
                            <div
                              key={todo.id}
                              onClick={(e) => {
                                e.stopPropagation();
                                openModalForEdit(todo);
                              }}
                              className={`text-[8px] px-1 py-0.5 rounded truncate font-bold cursor-pointer transition shadow-2xs ${
                                todo.isEssential ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-700'
                              } ${todo.completed ? 'line-through opacity-40' : ''}`}
                              title={todo.title}
                            >
                              {todo.title}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Todo作成・編集モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between mb-3">
                  <h2 className="text-xs font-bold text-slate-800">
                    {editingTodo ? 'ToDoの編集・削除' : '新規ToDo作成'}
                  </h2>
                  {editingTodo && (
                    <button
                      type="button"
                      onClick={() => deleteTodo(editingTodo.id)}
                      className="text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition"
                    >
                      <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                      削除
                    </button>
                  )}
                </div>

                <form onSubmit={handleSaveTodo} className="space-y-2.5">
                  <input
                    type="text"
                    value={formTitle}
                    onChange={(e) => setFormTitle(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-base outline-none focus:ring-2 focus:ring-indigo-500 font-bold"
                    placeholder="タイトル"
                    required
                  />

                  <textarea
                    value={formDetail}
                    onChange={(e) => setFormDetail(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-base outline-none focus:ring-2 focus:ring-indigo-500 h-16"
                    placeholder="詳細メモ..."
                  />

                  {/* 期間指定の有無 */}
                  <div className="bg-slate-50 p-2 rounded-xl border border-slate-200/60 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-[10px] font-bold text-slate-600">期間（期限）を設定する</label>
                      <input
                        type="checkbox"
                        checked={formHasDate}
                        onChange={(e) => setFormHasDate(e.target.checked)}
                        className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                      />
                    </div>
                    {formHasDate && (
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <div>
                          <label className="block text-[9px] font-bold text-slate-400 mb-0.5">開始日</label>
                          <input
                            type="date"
                            value={formStartDate}
                            onChange={(e) => setFormStartDate(e.target.value)}
                            className="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-base outline-none bg-white"
                          />
                        </div>
                        <div>
                          <label className="block text-[9px] font-bold text-slate-400 mb-0.5">終了日</label>
                          <input
                            type="date"
                            value={formEndDate}
                            onChange={(e) => setFormEndDate(e.target.value)}
                            className="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-base outline-none bg-white"
                          />
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 時間指定の有無 */}
                  <div className="bg-slate-50 p-2 rounded-xl border border-slate-200/60 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-[10px] font-bold text-slate-600">時間を指定する</label>
                      <input
                        type="checkbox"
                        checked={formHasTime}
                        onChange={(e) => setFormHasTime(e.target.checked)}
                        className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                      />
                    </div>
                    {formHasTime && (
                      <div>
                        <input
                          type="time"
                          value={formTime}
                          onChange={(e) => setFormTime(e.target.value)}
                          className="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-base outline-none bg-white"
                        />
                      </div>
                    )}
                  </div>

                  {/* フラグ（必須・ロック） */}
                  <div className="flex items-center justify-between pt-1">
                    <label className="flex items-center gap-1.5 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={formIsEssential}
                        onChange={(e) => setFormIsEssential(e.target.checked)}
                        className="w-4 h-4 text-red-600 rounded border-slate-300 focus:ring-red-500"
                      />
                      <span className="text-xs font-bold text-red-600">必須 (最優先)</span>
                    </label>

                    <label className="flex items-center gap-1.5 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={formIsLocked}
                        onChange={(e) => setFormIsLocked(e.target.checked)}
                        className="w-4 h-4 text-slate-700 rounded border-slate-300 focus:ring-slate-500"
                      />
                      <span className="text-xs font-bold text-slate-700">🔒 ロック (誤削除防止)</span>
                    </label>
                  </div>

                  <div>
                    <label className="block text-[9px] font-bold text-slate-400 mb-0.5">タグ</label>
                    <div className="flex flex-wrap gap-1 mb-1">
                      {tags.map(tag => {
                        const isSelected = formTags.includes(tag);
                        return (
                          <button
                            type="button"
                            key={tag}
                            onClick={() => {
                              if (isSelected) setFormTags(formTags.filter(t => t !== tag));
                              else setFormTags([...formTags, tag]);
                            }}
                            className={`px-2 py-0.5 rounded-md text-[9px] font-bold transition ${
                              isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                            }`}
                          >
                            #{tag}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex gap-1">
                      <input
                        type="text"
                        placeholder="新規タグ..."
                        value={newTagInput}
                        onChange={(e) => setNewTagInput(e.target.value)}
                        className="flex-1 px-2 py-1 border border-slate-200 rounded-md text-base outline-none"
                      />
                      <button type="button" onClick={handleAddTag} className="bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-md text-[10px] font-bold">追加</button>
                    </div>
                  </div>

                  <div className="flex justify-end gap-1.5 pt-2 border-t border-slate-100 mt-2">
                    <button type="button" onClick={closeModal} className="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50">キャンセル</button>
                    <button type="submit" className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-md shadow-indigo-100">保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 設定 ＆ ゴミ箱モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl w-full max-w-xs p-4 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h2 className="text-xs font-bold text-slate-800">設定・各種機能</h2>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 p-0.5">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                {/* 天気予報の地域選択 */}
                <div className="space-y-1.5">
                  <label className="block text-[10px] font-bold text-slate-500">天気予報の地域設定</label>
                  <select
                    value={locationCode}
                    onChange={(e) => handleSaveLocation(e.target.value)}
                    className="w-full px-2 py-1.5 border border-slate-200 rounded-lg text-xs bg-white font-bold outline-none"
                  >
                    {PREFECTURES.map(p => (
                      <option key={p.code} value={p.code}>{p.name}</option>
                    ))}
                  </select>
                </div>

                {/* ゴミ箱管理ボタン */}
                <div className="pt-2 border-t border-slate-100 space-y-1">
                  <label className="block text-[10px] font-bold text-slate-500">ゴミ箱（24時間保管）</label>
                  <button
                    onClick={() => setIsTrashOpen(true)}
                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-1.5 transition"
                  >
                    <i data-lucide="trash-2" className="w-3.5 h-3.5 text-rose-500"></i>
                    ゴミ箱を開く ({trash.length}件)
                  </button>
                </div>

                <div className="flex justify-end pt-2">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* ゴミ箱専用モーダル */}
          {isTrashOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl border border-slate-100 space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <div className="flex items-center gap-1.5">
                    <i data-lucide="trash-2" className="w-4 h-4 text-rose-500"></i>
                    <h2 className="text-xs font-bold text-slate-800">ゴミ箱 (24時間以内なら復元可能)</h2>
                  </div>
                  <button onClick={() => setIsTrashOpen(false)} className="text-slate-400 p-0.5">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {trash.length === 0 ? (
                    <div className="p-6 text-center text-slate-400 text-xs">
                      ゴミ箱は空です。
                    </div>
                  ) : (
                    trash.map(item => (
                      <div key={item.id} className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex items-center justify-between">
                        <div className="min-w-0 flex-1">
                          <p className="font-bold text-slate-700 text-xs truncate">{item.title}</p>
                          <p className="text-[9px] text-slate-400">削除日時: {new Date(item.deletedAt).toLocaleTimeString()}</p>
                        </div>
                        <div className="flex items-center gap-1.5 ml-2">
                          <button
                            onClick={() => restoreFromTrash(item.id)}
                            className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded-lg text-[10px] font-bold"
                          >
                            復元
                          </button>
                          <button
                            onClick={() => permanentlyDeleteFromTrash(item.id)}
                            className="text-slate-400 hover:text-rose-600 p-1"
                            title="完全削除"
                          >
                            <i data-lucide="x" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex justify-end pt-1">
                  <button onClick={() => setIsTrashOpen(false)} className="px-3 py-1 bg-slate-800 text-white rounded-lg text-xs font-bold">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* リスト追加モーダル */}
          {isNewListModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50">
              <div className="bg-white rounded-2xl w-full max-w-xs p-4 shadow-2xl border border-slate-100">
                <h2 className="text-xs font-bold text-slate-800 mb-2">新規リスト作成</h2>
                <form onSubmit={handleCreateList} className="space-y-2.5">
                  <input
                    type="text"
                    value={newListName}
                    onChange={(e) => setNewListName(e.target.value)}
                    className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-base outline-none focus:ring-2 focus:ring-indigo-500 font-bold"
                    placeholder="リスト名"
                    required
                  />
                  <div className="flex justify-end gap-1.5 pt-1">
                    <button type="button" onClick={() => setIsNewListModalOpen(false)} className="px-2.5 py-1 border border-slate-200 rounded-lg text-xs font-bold">キャンセル</button>
                    <button type="submit" className="px-2.5 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold">作成</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
