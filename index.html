    function isJapaneseHoliday(year, month, day) {
      const dateStr = `${month}/${day}`;
      const fixedHolidays = ['1/1', '1/2', '1/3', '2/11', '2/23', '4/29', '5/3', '5/4', '5/5', '8/11', '11/3', '11/23'];
      if (fixedHolidays.includes(dateStr)) return true;
      if (month === 3 && (day === 20 || day === 21)) return true;
      if (month === 9 && (day === 22 || day === 23)) return true;
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 1) {
        const weekNum = Math.ceil(day / 7);
        if (month === 1 && weekNum === 2) return true;
        if (month === 9 && weekNum === 3) return true;
        if (month === 10 && weekNum === 2) return true;
      }
      return false;
    }

    function isNonWorkingDay(year, month, day) {
      const d = new Date(year, month - 1, day);
      const dayOfWeek = d.getDay();
      if (dayOfWeek === 0 || dayOfWeek === 6) return true;
      return isJapaneseHoliday(year, month, day);
    }

    function getAdjustedPaydayDateStr(year, month, targetDayNum, adjustmentType) {
      let targetDate = new Date(year, month - 1, parseInt(targetDayNum, 10));
      if (targetDate.getMonth() !== month - 1) {
        targetDate = new Date(year, month, 0);
      }
      let y = targetDate.getFullYear();
      let m = targetDate.getMonth() + 1;
      let d = targetDate.getDate();

      if (adjustmentType === 'none') return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      if (adjustmentType === 'prev') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() - 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      } else if (adjustmentType === 'next') {
        while (isNonWorkingDay(y, m, d)) {
          targetDate.setDate(targetDate.getDate() + 1);
          y = targetDate.getFullYear(); m = targetDate.getMonth() + 1; d = targetDate.getDate();
        }
      }
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function App() {
      const [authMode, setAuthMode] = useState('login'); 
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [customIdInput, setCustomIdInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [activeTab, setActiveTab] = useState('today');

      const [todos, setTodos] = useState([]);

      const [shoppings, setShoppings] = useState([]); 

      const [trash, setTrash] = useState([]);

      const [shopName, setShopName] = useState('');
      const [shopHasDate, setShopHasDate] = useState(true);
      const [shopDate, setShopDate] = useState(realTodayStr);
      const [shopDetail, setShopDetail] = useState('');

      const [isNewListModalOpen, setIsNewListModalOpen] = useState(false);
      const [isEditListModalOpen, setIsEditListModalOpen] = useState(false);
      const [editListNameInput, setEditListNameInput] = useState('');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('account');
      
      const [isBulkWorkModalOpen, setIsBulkWorkModalOpen] = useState(false);
      const [bulkEditRows, setBulkEditRows] = useState({});

      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [accountMsg, setAccountMsg] = useState('');
      const [feedbackInput, setFeedbackInput] = useState('');
      const [feedbackMsg, setFeedbackMsg] = useState('');

      const [newQuickMemo, setNewQuickMemo] = useState('');
      const [newListName, setNewListName] = useState('');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [weather, setWeather] = useState({ text: '読み込み中...', icon: '🌤️' });

      useEffect(() => {
        const checkFirebaseReady = setInterval(() => {
          if (window.firebaseApp) {
            clearInterval(checkFirebaseReady);
            const { auth, onAuthStateChanged, db, doc, onSnapshot } = window.firebaseApp;

            onAuthStateChanged(auth, (user) => {
              if (user) {
                setCurrentUser(user);
                setIsLoggedIn(true);

                const docRef = doc(db, "users", user.uid);
                onSnapshot(docRef, (docSnap) => {
                  if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.lists) setLists(data.lists);
                    if (data.selectedListId) setSelectedListId(data.selectedListId);
                    if (data.todos) setTodos(data.todos);
                    if (data.events) setEvents(data.events);
                    if (data.shoppings) setShoppings(data.shoppings);
                    if (data.trash) setTrash(data.trash);
                    if (data.memos) setMemos(data.memos);
                    if (data.locationCode) setLocationCode(data.locationCode);
                    if (data.theme) setTheme(data.theme);
                    if (data.workHours) setWorkHours(data.workHours);
                    if (data.defaultWorkStart) setDefaultWorkStart(data.defaultWorkStart);
                    if (data.defaultWorkEnd) setDefaultWorkEnd(data.defaultWorkEnd);
                    if (data.payday) setPayday(data.payday);
                    if (data.paydayAdjustment) setPaydayAdjustment(data.paydayAdjustment);
                    if (data.holidays) setHolidays(data.holidays);
                    if (data.memberNames) setMemberNames(data.memberNames);
                    if (data.essentialNoticeDays) setEssentialNoticeDays(data.essentialNoticeDays);
                  } else {
                    const defaultData = {
                      lists: [{ id: '1', name: 'メインリスト' }],
                      selectedListId: '1',
                      todos: [],
                      events: [],
                      shoppings: [],
                      trash: [],
                      memos: [],
                      locationCode: '230000',
                      theme: 'simple',
                      workHours: {},
                      defaultWorkStart: '09:00',
                      defaultWorkEnd: '18:00',
                      payday: '25',
                      paydayAdjustment: 'prev',
                      holidays: [],
                      memberNames: ['自分', '家族'],
                      essentialNoticeDays: 7
                    };
                    setDoc(docRef, defaultData);
                  }
                });
              } else {
                setCurrentUser(null);
                setIsLoggedIn(false);
              }
            });
          }
        }, 100);
      }, []);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      useEffect(() => { document.body.className = `theme-${theme}`; }, [theme]);

      useEffect(() => {
        if (!isLoggedIn) return;
        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${locationCode}.json`)
          .then(res => res.json())
          .then(data => {
            const todayWeather = data[0].timeSeries[0].areas[0].weathers[0];
            let icon = '☀️';
            if (todayWeather.includes('雨')) icon = '🌧️';
            else if (todayWeather.includes('くもり') || todayWeather.includes('曇')) icon = '☁️';
            else if (todayWeather.includes('雪')) icon = '❄️';
            setWeather({ text: todayWeather.split('　')[0], icon });
          })
          .catch(() => setWeather({ text: '晴れ時々くもり', icon: '🌤️' }));
      }, [locationCode, isLoggedIn]);

      const saveUserDataToFirebase = async (overrides = {}) => {
        if (!currentUser) return;
        const { db, doc, setDoc } = window.firebaseApp;
        const docRef = doc(db, "users", currentUser.uid);
        
        const payload = {
          lists, selectedListId, todos, events, shoppings, trash, memos, locationCode,
          theme, workHours, defaultWorkStart, defaultWorkEnd, payday, paydayAdjustment, holidays,
          memberNames, essentialNoticeDays, ...overrides
        };

        await setDoc(docRef, payload, { merge: true });
      };

      const formatEmailFromId = (id) => `${id.trim().toLowerCase()}@app.local`;

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanId = customIdInput.trim();
        const cleanPass = passwordInput.trim();

        if (!cleanId || !cleanPass) {
          setAuthError('IDとパスワードを入力してください');
          return;
        }

        if (cleanPass.length < 6) {
          setAuthError('パスワードは6文字以上で入力してください');
          return;
        }

        const internalEmail = formatEmailFromId(cleanId);
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseApp;

        try {
          if (authMode === 'signup') {
            await createUserWithEmailAndPassword(auth, internalEmail, cleanPass);
          } else {
            await signInWithEmailAndPassword(auth, internalEmail, cleanPass);
          }
        } catch (err) {
          setAuthError('IDまたはパスワードが正しくありません。');
        }
  };

      const handleUpdatePassword = async (e) => {

          setAccountMsg('❌ パスワードは6文字以上で入力してください');
          return;

        try {
          await updatePassword(currentUser, newPasswordInput.trim());

          setNewPasswordInput('');
        } catch (err) {
          setAccountMsg('❌ 更新失敗 (再ログインが必要な場合があります)');

      const handleSendFeedback = async (e) => {
        e.preventDefault();
        if (!feedbackInput.trim()) return;
        const { db, collection, addDoc } = window.firebaseApp;

            userId: currentUser.email.replace('@app.local', ''),
            text: feedbackInput.trim(),
            date: new Date().toLocaleString('ja-JP')

          setFeedbackMsg('🎉 リクエストを送信しました！');
        } catch {
          setFeedbackMsg('❌ 送信に失敗しました');
        }
      };

      // 仕事時間の一括保存（未定や休みはカレンダー非表示、一括登録画面のみ記録維持）
      const handleSaveTableBulkWorkHours = (e) => {
        e.preventDefault();
        const nextHours = { ...workHours };
        Object.keys(bulkEditRows).forEach(dateStr => {
          const row = bulkEditRows[dateStr];
          const type = row.type || 'time';
          if (type === 'unfixed') {
            nextHours[dateStr] = { type: 'unfixed', start: '', end: '' };
          } else if (type === 'off') {
            nextHours[dateStr] = { type: 'off', start: '', end: '' };
          } else {
            const startVal = row.start ? row.start.trim() : '';
            const endVal = row.end ? row.end.trim() : '';
            if (startVal && endVal) {
              nextHours[dateStr] = { type: 'time', start: startVal, end: endVal };
            } else {
              delete nextHours[dateStr];
            }
          }
        });
        setWorkHours(nextHours);
        saveUserDataToFirebase({ workHours: nextHours });
        setIsBulkWorkModalOpen(false);
      };

        const targetYear = currentDate.getFullYear();
        const targetMonth = currentDate.getMonth();
        const daysInMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
        const rows = {};
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const existing = workHours[dateStr];
          if (existing) {
            rows[dateStr] = {
              type: existing.type || 'time',
              start: existing.start || '',
              end: existing.end || ''
            };
          } else {
            rows[dateStr] = {
              type: 'time',
              start: defaultWorkStart,
              end: defaultWorkEnd
            };
          }
        }
        setBulkEditRows(rows);
        setIsBulkWorkModalOpen(true);
      };

          title: todoTitle.trim(),
          icon: todoIcon || '💼',
          date: todoDate,
          hasTime: todoHasTime,
          time: todoHasTime ? todoTime : '',

          completed: false

        let next;

          who: eventWho.trim(),
          icon: eventIcon || '🎉',
          date: eventDate

        if (editingItem) {
          next = events.map(ev => ev.id === editingItem.id ? { ...ev, ...payload } : ev);

          next = [...events, { id: Date.now().toString(), listId: selectedListId, ...payload }];

        setEvents(next);
        saveUserDataToFirebase({ events: next });
        closeModal();
      };

        let next;

          name: shopName.trim(),
          date: shopHasDate ? shopDate : '',
          detail: shopDetail.trim(),
          completed: false
        };

          next = shoppings.map(s => s.id === editingItem.id ? { ...s, ...payload } : s);

        setShoppings(next);
        saveUserDataToFirebase({ shoppings: next });
        closeModal();

        setShoppings(next);
        saveUserDataToFirebase({ shoppings: next });
      };

      const deleteTodo = (id) => {
        const next = todos.filter(t => t.id !== id);
        setTodos(next);
        saveUserDataToFirebase({ todos: next });
      };

      const deleteEvent = (id) => {
        const next = events.filter(e => e.id !== id);
        setEvents(next);
        saveUserDataToFirebase({ events: next });
      };

      const deleteShopping = (id) => {
        const next = shoppings.filter(s => s.id !== id);
        setShoppings(next);
        saveUserDataToFirebase({ shoppings: next });
      };

          setTodoTitle(item ? item.title : '');
          setTodoIcon(item ? item.icon : '💼');
          setTodoDate(item ? item.date : viewingDateStr);
          setTodoHasTime(item ? item.hasTime : false);
          setTodoTime(item ? item.time : '09:00');
          setTodoDetail(item ? item.detail : '');

          const presets = ['休日', '誕生日', '冠婚葬祭'];
          if (item) {
            if (presets.includes(item.title)) {

              setEventCustomTitle('');

            setEventIcon(item.icon || '🎉');

            setEventTypePreset('休日');

            setEventIcon('🎉');
            setEventDate(viewingDateStr);

        } else if (type === 'shopping') {
          setShopName(item ? item.name : '');
          setShopHasDate(item ? !!item.date : true);
          setShopDate(item && item.date ? item.date : viewingDateStr);
          setShopDetail(item ? item.detail : '');
        }
      };

      const closeModal = () => {
        setActiveModalType(null);
        setEditingItem(null);

        if (!newQuickMemo.trim()) return;
        const nextMemos = [{ id: Date.now().toString(), text: newQuickMemo.trim(), date: targetDate || '', completed: false }, ...memos];
        setMemos(nextMemos);
        saveUserDataToFirebase({ memos: nextMemos });
        setNewQuickMemo('');

      const toggleMemoComplete = (id) => {
        const nextMemos = memos.map(m => m.id === id ? { ...m, completed: !m.completed } : m);
        setMemos(nextMemos);
        saveUserDataToFirebase({ memos: nextMemos });
      };

      const deleteMemo = (id) => {
        const nextMemos = memos.filter(m => m.id !== id);
        setMemos(nextMemos);
        saveUserDataToFirebase({ memos: nextMemos });
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        const nextLists = [...lists, newList];
        setLists(nextLists); setSelectedListId(newList.id);
        saveUserDataToFirebase({ lists: nextLists, selectedListId: newList.id });
        setNewListName(''); setIsNewListModalOpen(false);
      };

      const handleOpenEditListModal = () => {
        const target = lists.find(l => l.id === selectedListId);
        if (target) {
          setEditListNameInput(target.name);
          setIsEditListModalOpen(true);
        }
      };

      const handleUpdateListName = (e) => {
        e.preventDefault();
        if (!editListNameInput.trim()) return;
        const nextLists = lists.map(l => l.id === selectedListId ? { ...l, name: editListNameInput.trim() } : l);
        setLists(nextLists);
        saveUserDataToFirebase({ lists: nextLists });
        setIsEditListModalOpen(false);

                    <label className="block text-[10px] opacity-60 font-bold">💼 デフォルトの仕事・活動時間 (テンプレ)</label>
                    <div className="flex items-center gap-2">
                      <input type="time" value={defaultWorkStart} onChange={(e) => handleSaveDefaultWorkTemplate(e.target.value, defaultWorkEnd)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold text-center" />
                      <span className="font-bold text-slate-500">〜</span>
                      <input type="time" value={defaultWorkEnd} onChange={(e) => handleSaveDefaultWorkTemplate(defaultWorkStart, e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-xs font-bold text-center" />
                    </div>
                  </div>
                )}

                {settingsTab === 'app' && (
                  <div className="space-y-3 pt-1">
                    <label className="block text-[10px] opacity-60">デザインテーマ</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      <button onClick={() => handleSaveTheme('simple')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'simple' ? 'bg-slate-900 text-white' : 'bg-black/5'}`}>⚪ シンプル</button>
                      <button onClick={() => handleSaveTheme('animal')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'animal' ? 'bg-rose-400 text-white' : 'bg-pink-50 text-rose-800'}`}>🐾 アニマル</button>
                      <button onClick={() => handleSaveTheme('business')} className={`p-2 rounded-xl text-xs font-bold ${theme === 'business' ? 'bg-blue-600 text-white' : 'bg-black/5'}`}>💼 ビジネス</button>
                    </div>
                  </div>
                )}

                {settingsTab === 'feedback' && (
                  <form onSubmit={handleSendFeedback} className="space-y-2 pt-1">
                    {feedbackMsg && <div className="p-2 bg-emerald-500/10 text-emerald-600 font-bold text-[10px] rounded-xl text-center">{feedbackMsg}</div>}
                    <textarea value={feedbackInput} onChange={(e) => setFeedbackInput(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs h-20" placeholder="ご意見やリクエストを入力..." required />
                    <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">送信</button>
                  </form>
                )}

                <div className="flex justify-end pt-2 border-t">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white">閉じる</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
