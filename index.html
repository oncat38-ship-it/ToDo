<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo & カレンダー App</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ内でJSXを変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // ログイン状態
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userId, setUserId] = useState('');
      const [password, setPassword] = useState('');

      // タブ・リスト・データ
      const [activeTab, setActiveTab] = useState('today'); // 'today' | 'calendar' | 'todos'
      const [lists, setLists] = useState([{ id: 'default', name: 'メインリスト' }]);
      const [selectedListId, setSelectedListId] = useState('default');
      const [todos, setTodos] = useState([]);
      const [tags, setTags] = useState(['仕事', 'プライベート', '重要', '学習']);

      // 検索・フィルター
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTagFilter, setSelectedTagFilter] = useState('すべて');

      // ToDoモーダル
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTodo, setEditingTodo] = useState(null);

      // Form State
      const [formTitle, setFormTitle] = useState('');
      const [formDetail, setFormDetail] = useState('');
      const [formStartDate, setFormStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [formEndDate, setFormEndDate] = useState(new Date().toISOString().split('T')[0]);
      const [formTime, setFormTime] = useState('09:00');
      const [formPriority, setFormPriority] = useState('中');
      const [formTags, setFormTags] = useState([]);
      const [newTagInput, setNewTagInput] = useState('');

      // 新規リスト作成モーダル
      const [isNewListModalOpen, setIsNewListModalOpen] = useState(false);
      const [newListName, setNewListName] = useState('');

      // カレンダー用月
      const [currentDate, setCurrentDate] = useState(new Date());

      // 初回ロード（LocalStorage）
      useEffect(() => {
        const savedUser = localStorage.getItem('app_user');
        if (savedUser) {
          setIsLoggedIn(true);
          setUserId(savedUser);
        }
        const savedTodos = localStorage.getItem('app_todos');
        if (savedTodos) setTodos(JSON.parse(savedTodos));
        const savedLists = localStorage.getItem('app_lists');
        if (savedLists) setLists(JSON.parse(savedLists));
        const savedTags = localStorage.getItem('app_tags');
        if (savedTags) setTags(JSON.parse(savedTags));
      }, []);

      // 保存（LocalStorage）
      useEffect(() => {
        if (isLoggedIn) {
          localStorage.setItem('app_todos', JSON.stringify(todos));
          localStorage.setItem('app_lists', JSON.stringify(lists));
          localStorage.setItem('app_tags', JSON.stringify(tags));
        }
      }, [todos, lists, tags, isLoggedIn]);

      // アイコン再レンダリング処理
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // 通知権限リクエスト
      const requestNotification = () => {
        if ('Notification' in window) {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              new Notification('通知が有効化されました', { body: '期限が近づいたToDoをお知らせします。' });
            }
          });
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (!userId || !password) return;
        setIsLoggedIn(true);
        localStorage.setItem('app_user', userId);
        requestNotification();
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setUserId('');
        setPassword('');
        localStorage.removeItem('app_user');
      };

      // ToDo追加・更新
      const handleSaveTodo = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        if (editingTodo) {
          setTodos(todos.map(t => t.id === editingTodo.id ? {
            ...t,
            title: formTitle,
            detail: formDetail,
            startDate: formStartDate,
            endDate: formEndDate,
            time: formTime,
            priority: formPriority,
            tags: formTags,
          } : t));
        } else {
          const newTodo = {
            id: Date.now().toString(),
            listId: selectedListId,
            title: formTitle,
            detail: formDetail,
            startDate: formStartDate,
            endDate: formEndDate,
            time: formTime,
            priority: formPriority,
            tags: formTags,
            completed: false,
          };
          setTodos([...todos, newTodo]);
        }
        closeModal();
      };

      const openModalForCreate = () => {
        setEditingTodo(null);
        setFormTitle('');
        setFormDetail('');
        setFormStartDate(new Date().toISOString().split('T')[0]);
        setFormEndDate(new Date().toISOString().split('T')[0]);
        setFormTime('09:00');
        setFormPriority('中');
        setFormTags([]);
        setIsModalOpen(true);
      };

      const openModalForEdit = (todo) => {
        setEditingTodo(todo);
        setFormTitle(todo.title);
        setFormDetail(todo.detail);
        setFormStartDate(todo.startDate);
        setFormEndDate(todo.endDate);
        setFormTime(todo.time);
        setFormPriority(todo.priority);
        setFormTags(todo.tags);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingTodo(null);
      };

      const deleteTodo = (id) => {
        setTodos(todos.filter(t => t.id !== id));
      };

      const toggleComplete = (id) => {
        setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const handleAddTag = () => {
        if (newTagInput.trim() && !tags.includes(newTagInput.trim())) {
          setTags([...tags, newTagInput.trim()]);
          setNewTagInput('');
        }
      };

      const handleCreateList = (e) => {
        e.preventDefault();
        if (!newListName.trim()) return;
        const newList = { id: Date.now().toString(), name: newListName.trim() };
        setLists([...lists, newList]);
        setSelectedListId(newList.id);
        setNewListName('');
        setIsNewListModalOpen(false);
      };

      // フィルター計算
      const currentListTodos = todos.filter(t => t.listId === selectedListId);
      const filteredTodos = currentListTodos.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              t.detail.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = selectedTagFilter === 'すべて' || t.tags.includes(selectedTagFilter);
        return matchesSearch && matchesTag;
      });

      // 本日の予定
      const todayStr = new Date().toISOString().split('T')[0];
      const todayTodos = currentListTodos.filter(t => t.startDate <= todayStr && t.endDate >= todayStr);

      // カレンダー用
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();

      const calendarDays = [];
      for (let i = 0; i < firstDayOfMonth; i++) calendarDays.push(null);
      for (let i = 1; i <= lastDateOfMonth; i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        calendarDays.push({ day: i, dateStr });
      }

      // 未ログイン状態
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
              <div className="text-center mb-8">
                <div className="bg-indigo-600 text-white p-3 rounded-full w-12 h-12 flex items-center justify-center mx-auto mb-3 shadow-md">
                  <i data-lucide="check-square" className="w-6 h-6"></i>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">ToDo & カレンダー</h1>
                <p className="text-sm text-slate-500 mt-1">IDとパスワードでログインしてください</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ユーザーID</label>
                  <input
                    type="text"
                    value={userId}
                    onChange={(e) => setUserId(e.target.value)}
                    className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    placeholder="例: user01"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">パスワード</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition shadow-md text-sm"
                >
                  ログイン / 新規開始
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
          {/* サイドバー */}
          <aside className="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4">
            <div>
              <div className="flex items-center justify-between mb-6 px-2">
                <div className="flex items-center gap-2">
                  <div className="bg-indigo-600 text-white p-2 rounded-lg shadow">
                    <i data-lucide="check-square" className="w-5 h-5"></i>
                  </div>
                  <span className="font-bold text-slate-800">ToDo & カレンダー</span>
                </div>
              </div>

              {/* リスト選択 */}
              <div className="mb-6">
                <div className="flex items-center justify-between px-2 mb-2">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">ToDoリスト選択</span>
                  <button onClick={() => setIsNewListModalOpen(true)} className="text-indigo-600 hover:text-indigo-800">
                    <i data-lucide="folder-plus" className="w-4 h-4"></i>
                  </button>
                </div>
                <div className="space-y-1">
                  {lists.map(list => (
                    <button
                      key={list.id}
                      onClick={() => setSelectedListId(list.id)}
                      className={`w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition ${
                        selectedListId === list.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      📁 {list.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* ナビゲーションタブ */}
              <nav className="space-y-1">
                <button
                  onClick={() => setActiveTab('today')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'today' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="sun" className="w-4 h-4"></i>
                  当日の予定
                </button>
                <button
                  onClick={() => setActiveTab('calendar')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="calendar" className="w-4 h-4"></i>
                  カレンダー
                </button>
                <button
                  onClick={() => setActiveTab('todos')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'todos' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  <i data-lucide="check-square" className="w-4 h-4"></i>
                  ToDoリスト
                </button>
              </nav>
            </div>

            {/* ユーザー情報＆ログアウト */}
            <div className="pt-4 border-t border-slate-200 mt-4 flex items-center justify-between">
              <div className="text-xs text-slate-500 truncate">
                ログインID: <span className="font-semibold text-slate-700">{userId}</span>
              </div>
              <button onClick={handleLogout} className="text-slate-400 hover:text-red-600 transition" title="ログアウト">
                <i data-lucide="log-out" className="w-4 h-4"></i>
              </button>
            </div>
          </aside>

          {/* メインエリア */}
          <main className="flex-1 flex flex-col h-screen overflow-y-auto">
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
              <h1 className="text-lg font-bold text-slate-800">
                {activeTab === 'today' && '☀️ 当日の予定'}
                {activeTab === 'calendar' && '📅 カレンダー'}
                {activeTab === 'todos' && '📝 ToDoリスト一覧'}
              </h1>
              <button
                onClick={openModalForCreate}
                className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow transition"
              >
                <i data-lucide="plus" className="w-4 h-4"></i>
                新しいToDoを作成
              </button>
            </header>

            <div className="p-6 flex-1">
              {/* 当日の予定 */}
              {activeTab === 'today' && (
                <div className="max-w-3xl mx-auto space-y-4">
                  <div className="bg-gradient-to-r from-indigo-500 to-violet-600 rounded-2xl p-6 text-white shadow-md">
                    <h2 className="text-xl font-bold">本日の予定 ({todayStr})</h2>
                    <p className="text-indigo-100 text-sm mt-1">今日も1日頑張りましょう！完了したタスクはチェックを入れていきましょう。</p>
                  </div>

                  <div className="space-y-3">
                    {todayTodos.length === 0 ? (
                      <div className="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400">
                        本日の予定されているToDoはありません。素晴らしい1日を！
                      </div>
                    ) : (
                      todayTodos.map(todo => (
                        <div key={todo.id} className={`bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 ${todo.completed ? 'opacity-60 bg-slate-50' : ''}`}>
                          <div className="flex items-start gap-3">
                            <input
                              type="checkbox"
                              checked={todo.completed}
                              onChange={() => toggleComplete(todo.id)}
                              className="mt-1 w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                            />
                            <div>
                              <div className="flex items-center gap-2">
                                <h3 className={`font-semibold text-slate-800 ${todo.completed ? 'line-through text-slate-400' : ''}`}>{todo.title}</h3>
                                <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                                  todo.priority === '必須' ? 'bg-red-100 text-red-700' :
                                  todo.priority === '高' ? 'bg-orange-100 text-orange-700' :
                                  todo.priority === '中' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'
                                }`}>{todo.priority}</span>
                              </div>
                              {todo.detail && <p className="text-sm text-slate-600 mt-1">{todo.detail}</p>}
                              <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-slate-400">
                                <span>🕒 {todo.time}</span>
                                <span>📅 {todo.startDate} 〜 {todo.endDate}</span>
                                {todo.tags.map(tag => (
                                  <span key={tag} className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">#{tag}</span>
                                ))}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => openModalForEdit(todo)} className="text-slate-400 hover:text-indigo-600 p-1">
                              <i data-lucide="edit-3" className="w-4 h-4"></i>
                            </button>
                            <button onClick={() => deleteTodo(todo.id)} className="text-slate-400 hover:text-red-600 p-1">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* カレンダー */}
              {activeTab === 'calendar' && (
                <div className="max-w-5xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  <div className="flex items-center justify-between mb-6">
                    <h2 className="text-lg font-bold text-slate-800">
                      {year}年 {month + 1}月
                    </h2>
                    <div className="flex gap-2">
                      <button
                        onClick={() => setCurrentDate(new Date(year, month - 1, 1))}
                        className="px-3 py-1.5 border rounded-lg text-sm font-medium hover:bg-slate-50"
                      >
                        前月
                      </button>
                      <button
                        onClick={() => setCurrentDate(new Date())}
                        className="px-3 py-1.5 border rounded-lg text-sm font-medium hover:bg-slate-50"
                      >
                        今月
                      </button>
                      <button
                        onClick={() => setCurrentDate(new Date(year, month + 1, 1))}
                        className="px-3 py-1.5 border rounded-lg text-sm font-medium hover:bg-slate-50"
                      >
                        次月
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-7 gap-2 text-center font-semibold text-slate-400 text-xs mb-2">
                    <span className="text-red-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span className="text-blue-500">土</span>
                  </div>

                  <div className="grid grid-cols-7 gap-2">
                    {calendarDays.map((item, index) => {
                      if (!item) return <div key={`empty-${index}`} className="h-28 bg-slate-50/50 rounded-xl"></div>;
                      
                      const dayTodos = currentListTodos.filter(t => t.startDate <= item.dateStr && t.endDate >= item.dateStr);

                      return (
                        <div key={item.dateStr} className="h-28 border border-slate-100 bg-white rounded-xl p-2 flex flex-col overflow-hidden hover:border-slate-300 transition">
                          <div className="text-xs font-bold text-slate-700 mb-1">{item.day}</div>
                          <div className="flex-1 overflow-y-auto space-y-1">
                            {dayTodos.map(todo => (
                              <div
                                key={todo.id}
                                onClick={() => openModalForEdit(todo)}
                                className={`text-[10px] px-1.5 py-0.5 rounded truncate cursor-pointer font-medium ${
                                  todo.completed ? 'bg-slate-100 text-slate-400 line-through' : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100'
                                }`}
                                title={todo.title}
                              >
                                {todo.title}
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ToDoリスト */}
              {activeTab === 'todos' && (
                <div className="max-w-4xl mx-auto space-y-4">
                  <div className="flex flex-col sm:flex-row gap-3">
                    <div className="relative flex-1">
                      <input
                        type="text"
                        placeholder="タイトルや詳細で検索..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-4 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                    <div className="flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0">
                      <button
                        onClick={() => setSelectedTagFilter('すべて')}
                        className={`px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                          selectedTagFilter === 'すべて' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        すべて
                      </button>
                      {tags.map(tag => (
                        <button
                          key={tag}
                          onClick={() => setSelectedTagFilter(tag)}
                          className={`px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                            selectedTagFilter === tag ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                          }`}
                        >
                          #{tag}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    {filteredTodos.length === 0 ? (
                      <div className="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400">
                        条件に一致するToDoはありません。
                      </div>
                    ) : (
                      filteredTodos.map(todo => (
                        <div key={todo.id} className={`bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 ${todo.completed ? 'opacity-60 bg-slate-50' : ''}`}>
                          <div className="flex items-start gap-3">
                            <input
                              type="checkbox"
                              checked={todo.completed}
                              onChange={() => toggleComplete(todo.id)}
                              className="mt-1 w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                            />
                            <div>
                              <div className="flex items-center gap-2">
                                <h3 className={`font-semibold text-slate-800 ${todo.completed ? 'line-through text-slate-400' : ''}`}>{todo.title}</h3>
                                <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                                  todo.priority === '必須' ? 'bg-red-100 text-red-700' :
                                  todo.priority === '高' ? 'bg-orange-100 text-orange-700' :
                                  todo.priority === '中' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'
                                }`}>{todo.priority}</span>
                              </div>
                              {todo.detail && <p className="text-sm text-slate-600 mt-1">{todo.detail}</p>}
                              <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-slate-400">
                                <span>🕒 {todo.time}</span>
                                <span>📅 {todo.startDate} 〜 {todo.endDate}</span>
                                {todo.tags.map(tag => (
                                  <span key={tag} className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">#{tag}</span>
                                ))}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => openModalForEdit(todo)} className="text-slate-400 hover:text-indigo-600 p-1">
                              <i data-lucide="edit-3" className="w-4 h-4"></i>
                            </button>
                            <button onClick={() => deleteTodo(todo.id)} className="text-slate-400 hover:text-red-600 p-1">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Modal for Todo */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl w-full max-w-lg p-6 shadow-xl border border-slate-200">
                <h2 className="text-lg font-bold text-slate-800 mb-4">
                  {editingTodo ? 'ToDoを編集' : '新しいToDoを作成'}
                </h2>
                <form onSubmit={handleSaveTodo} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">タイトル</label>
                    <input
                      type="text"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      placeholder="例: プロジェクト企画書作成"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">詳細</label>
                    <textarea
                      value={formDetail}
                      onChange={(e) => setFormDetail(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none h-20"
                      placeholder="作業内容の詳細..."
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">開始日</label>
                      <input
                        type="date"
                        value={formStartDate}
                        onChange={(e) => setFormStartDate(e.target.value)}
                        className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">終了日（期間指定）</label>
                      <input
                        type="date"
                        value={formEndDate}
                        onChange={(e) => setFormEndDate(e.target.value)}
                        className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">時間</label>
                      <input
                        type="time"
                        value={formTime}
                        onChange={(e) => setFormTime(e.target.value)}
                        className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">重要度</label>
                      <select
                        value={formPriority}
                        onChange={(e) => setFormPriority(e.target.value)}
                        className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                      >
                        <option value="低">低</option>
                        <option value="中">中</option>
                        <option value="高">高</option>
                        <option value="必須">必須</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">タグ選択</label>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {tags.map(tag => {
                        const isSelected = formTags.includes(tag);
                        return (
                          <button
                            type="button"
                            key={tag}
                            onClick={() => {
                              if (isSelected) {
                                setFormTags(formTags.filter(t => t !== tag));
                              } else {
                                setFormTags([...formTags, tag]);
                              }
                            }}
                            className={`px-3 py-1 rounded-lg text-xs font-medium transition ${
                              isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            #{tag}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="新しいタグを追加..."
                        value={newTagInput}
                        onChange={(e) => setNewTagInput(e.target.value)}
                        className="flex-1 px-3 py-1.5 border rounded-lg text-xs outline-none"
                      />
                      <button
                        type="button"
                        onClick={handleAddTag}
                        className="bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium transition"
                      >
                        タグ作成
                      </button>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t">
                    <button
                      type="button"
                      onClick={closeModal}
                      className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow"
                    >
                      保存する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* New List Modal */}
          {isNewListModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl border border-slate-200">
                <h2 className="text-lg font-bold text-slate-800 mb-4">新しいToDoリストを作成</h2>
                <form onSubmit={handleCreateList} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">リスト名</label>
                    <input
                      type="text"
                      value={newListName}
                      onChange={(e) => setNewListName(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      placeholder="例: 副業プロジェクト"
                      required
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsNewListModalOpen(false)}
                      className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow"
                    >
                      作成
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
